revolution had won before France could take it back, and the document's compulsory labour clauses show a state that has abolished slavery but not the sugar economy it depends on."}, {"src": "ev-peterloo", "dst": "the-mask-of-anarchy", "type": "arises from", "note": "Written directly out of the Manchester killings and unpublishable while the Six Acts stood."}, {"src": "ev-peterloo", "dst": "a-defence-of-poetry", "type": "arises from", "note": "Shelley's claim for poetry's political function is made from exile in the repression that followed 1819."}, {"src": "ev-1848", "dst": "the-class-struggles-in-france-1848-1850", "type": "arises from", "note": "written as the events happen, then corrected against them"}, {"src": "ev-1848", "dst": "address-of-the-central-committee-to-the-communist-league", "type": "arises from", "note": "the permanent revolution formulation comes directly out of the defeat"}, {"src": "ev-1848", "dst": "the-peasant-war-in-germany", "type": "arises from", "note": "1525 read through 1848: the peasantry cannot lead, and cannot be ignored"}, {"src": "ev-1848", "dst": "the-stone-breakers", "type": "arises from", "note": "painted the year after the June days, by a man who would sit on the Commune"}, {"src": "ev-1848", "dst": "the-communist-manifesto", "type": "arises from", "note": "Commissioned by the Communist League and in print in London weeks before the February revolution in Paris."}, {"src": "ev-1848", "dst": "the-eighteenth-brumaire-of-louis-bonaparte", "type": "arises from", "note": "It is an autopsy on the defeat of 1848 written while the survivors were still arguing about who lost it."}, {"src": "ev-1848", "dst": "declaration-of-sentiments", "type": "arises from", "note": "Seneca Falls met in July 1848 in a transatlantic year of conventions and risings, and used the same repertoire."}, {"src": "ev-1848", "dst": "instructions-pour-une-prise-d-armes", "type": "arises from", "note": "Blanqui's manual is the lesson he drew from the June days, that spontaneous crowds lose to organised troops."}, {"src": "ev-1848", "dst": "a-burial-at-ornans", "type": "arises from", "note": "A provincial republican community given monumental treatment as the republic itself was being dismantled from Paris."}, {"src": "ev-1848", "dst": "der-ring-des-nibelungen", "type": "arises from", "note": "Wagner began the cycle on the run from a Dresden warrant after the May rising, and its politics never entirely recovered from the exile."}, {"src": "ev-1848", "dst": "mary-barton", "type": "arises from", "note": "Published in the year of the last great Chartist petition, it addresses a middle-class readership that had just been badly frightened."}, {"src": "ev-origin", "dst": "dialectics-of-nature", "type": "arises from", "note": "Engels takes Darwin as the natural-scientific counterpart of the materialist conception of history"}, {"src": "ev-origin", "dst": "the-part-played-by-labour-in-the-transition-from-ape-to-man", "type": "arises from", "note": "labour, not the brain, as the driver of hominisation"}, {"src": "ev-origin", "dst": "the-selfish-gene", "type": "arises from", "note": "Darwinism recast at the level of the gene, and widely read as a claim about society"}, {"src": "ev-origin", "dst": "experiments-on-plant-hybridisation", "type": "arises from", "note": "Mendel read Darwin and designed his crosses against the inheritance problem the Origin had left open."}, {"src": "ev-origin", "dst": "middlemarch", "type": "arises from", "note": "Eliot writes gradual causation and environmental determination into the novel form a decade after natural selection made them common sense."}, {"src": "ev-origin", "dst": "capital-volume-i", "type": "arises from", "note": "Marx sent Darwin a copy and modelled his history of technology on a natural history of organs, which is a debt and a method rather than a compliment."}, {"src": "ev-commune", "dst": "the-civil-war-in-france", "type": "arises from", "note": "the working class cannot simply lay hold of the ready-made state machinery"}, {"src": "ev-scramble", "dst": "imperialism-a-study", "type": "arises from", "note": "the partition of Africa is the fact the whole debate is about"}, {"src": "ev-scramble", "dst": "heart-of-darkness", "type": "arises from", "note": "Leopold's Congo, seen by a steamboat captain who went there"}, {"src": "ev-scramble", "dst": "the-peasant-question-in-france-and-germany", "type": "arises from", "note": "written as the export of capital reorganises the world market the peasantry sells into"}, {"src": "ev-scramble", "dst": "les-demoiselles-d-avignon", "type": "arises from", "note": "the masks in the Trocadero got to Paris the way rubber and ivory did"}, {"src": "ev-1905", "dst": "the-mass-strike-the-political-party-and-the-trade-unions", "type": "arises from", "note": "written directly out of the Russian events, against German caution"}, {"src": "ev-1905", "dst": "results-and-prospects", "type": "arises from", "note": "the soviet appears, and the theory of permanent revolution appears with it"}, {"src": "ev-1905", "dst": "mother", "type": "arises from", "note": "written on the road after the defeat, to raise money for the party"}, {"src": "ev-ww1", "dst": "imperialism-the-highest-stage-of-capitalism", "type": "arises from", "note": "written in Zurich to explain why the parties of the International voted for war credits"}, {"src": "ev-ww1", "dst": "the-state-and-revolution", "type": "arises from", "note": "the state that could conscript a continent had to be theorised before it could be broken"}, {"src": "ev-ww1", "dst": "conspectus-of-hegel-s-science-of-logic", "type": "arises from", "note": "the notebooks are what a defeat does to a theorist with time in a library"}, {"src": "ev-1917", "dst": "the-state-and-revolution", "type": "arises from", "note": "the pamphlet breaks off because the revolution interrupted it"}], "periods": [{"id": "bronze", "name": "Bronze Age palace and tributary societies", "start": -3000, "end": -1150, "mode": "Tributary / palace redistribution", "note": "Surplus is extracted through temple and palace storehouses rather than through markets. Writing appears as accountancy before it appears as literature, which is why the earliest texts are inventories and only later Gilgamesh."}, {"id": "archaic", "name": "Iron Age, the polis and the slave mode", "start": -1150, "end": -323, "mode": "Ancient slave mode", "note": "Iron cheapens tools and weapons and breaks the palace monopoly. The citizen-slaveholder polis produces a leisured stratum with the time to argue, and a philosophy that treats manual labour as beneath thought."}, {"id": "hellenistic", "name": "Hellenistic and Roman slave society", "start": -323, "end": 476, "mode": "Ancient slave mode, imperial scale", "note": "Conquest supplies slaves faster than technique improves, so productivity stagnates and thought turns from the polis to the consolation of the individual. Stoicism and Epicureanism are philosophies for people who have lost their politics."}, {"id": "transition-feudal", "name": "Transition to feudalism", "start": 476, "end": 1000, "mode": "Feudal, emergent", "note": "The collapse of the slave supply forces a shift to serfdom and manorial production. In the Islamic world and China commercial and scientific continuity is far stronger, which is why the Greek inheritance returns to Europe via Baghdad and Cordoba."}, {"id": "high-feudal", "name": "High feudalism and the commercial revival", "start": 1000, "end": 1350, "mode": "Feudal", "note": "The heavy plough, three-field rotation and the water mill raise the surplus; towns, universities and a merchant stratum grow inside the pores of a landed order. Scholasticism is the intellectual form of a society trying to reconcile Aristotle with a church that owns land."}, {"id": "crisis-feudal", "name": "Crisis of feudalism and primitive accumulation", "start": 1350, "end": 1600, "mode": "Feudal in decay, merchant capital rising", "note": "Plague, falling rents and peasant revolt break the manorial order. Enclosure, colonial plunder and the slave trade concentrate money capital and free a propertyless class. The Renaissance and Reformation are the ideological expression of that upheaval, not its cause."}, {"id": "manufacture", "name": "Bourgeois revolutions and the age of manufacture", "start": 1600, "end": 1789, "mode": "Merchant and manufacturing capital", "note": "The Dutch and English revolutions place commercial property in command of the state. Natural philosophy is reorganised around measurement and control because navigation, ballistics and mining demand it. Mechanism becomes the ruling metaphor for both nature and society."}, {"id": "industrial", "name": "Industrial capitalism and the making of the working class", "start": 1789, "end": 1871, "mode": "Industrial capital", "note": "Steam and the factory create the modern proletariat and with it the first workers movements. Classical political economy reaches its limit and splits: apologetics on one side, the critique of political economy on the other."}, {"id": "imperialism", "name": "Imperialism and monopoly capital", "start": 1871, "end": 1917, "mode": "Monopoly capital, capital export", "note": "Concentration produces trusts, banks fuse with industry, and the world is divided territorially. Marxism becomes a mass movement and simultaneously splits over whether that world order can be reformed."}, {"id": "wars-revolution", "name": "Revolution, counter-revolution and world war", "start": 1917, "end": 1945, "mode": "Monopoly capital in crisis; degenerated workers state", "note": "October proves the perspective and its isolation destroys it. Bureaucratic reaction in the USSR and fascist reaction in the West both shape what is thinkable, and drive the Frankfurt School's turn from revolution to the analysis of defeat."}, {"id": "postwar", "name": "Post-war boom and decolonisation", "start": 1945, "end": 1973, "mode": "Regulated industrial capital", "note": "An exceptional expansion buys social peace in the imperialist centres while national liberation transforms the colonies. Structuralism and systems thinking flourish in a period that feels engineered and stable."}, {"id": "neoliberal", "name": "Neoliberalism and the long downturn", "start": 1973, "end": 2008, "mode": "Financialised capital", "note": "The rate of profit falls, the boom ends, and defeat is generalised through deindustrialisation and the destruction of union power. Postmodernism registers that defeat as a claim about the impossibility of totality."}, {"id": "polycrisis", "name": "Crisis, stagnation and the present", "start": 2008, "end": 2026, "mode": "Financialised capital in stagnation", "note": "2008 ends the ideological monopoly of the market without producing a force able to replace it. Climate, automation and war return questions of planning and property to the centre while the organised working class remains historically weak."}], "events": [{"id": "ev-iron", "name": "Iron metallurgy spreads in the Mediterranean", "year": -1100, "kind": "technology", "note": "Cheap iron breaks the bronze-elite monopoly on arms and tools and underwrites the citizen-hoplite polis.", "works": [{"title": "The Iliad", "because": "the hoplite line, not the heroic duel, is the society the poem is sung to"}]}, {"id": "ev-coinage", "name": "Coinage in Lydia and Ionia", "year": -600, "kind": "technology", "note": "An abstract universal equivalent appears in daily life shortly before philosophers begin asking what the single underlying substance of things is.", "works": [{"title": "Fragments", "because": "Lyric appears in the Ionian and Aegean cities where coined money and trade were separating household wealth from clan obligation, and with it a private person who can address a private feeling."}, {"title": "Politics", "because": "Aristotle's analysis of money and of chrematistike is only possible after two centuries of coinage had made the difference between use and exchange a visible social fact rather than a philosopher's distinction."}]}, {"id": "ev-solon", "name": "Solon's reforms and debt cancellation at Athens", "year": -594, "kind": "class", "note": "Debt bondage of citizens is abolished and slavery is displaced onto foreigners, fixing the class structure that Athenian philosophy takes as natural.", "works": [{"title": "The Oresteia", "because": "the trilogy ends by founding a court, at the moment the Areopagus is being stripped of power"}, {"title": "The Republic", "because": "Plato is writing in a city whose political settlement rested on Solon's cancellation of debt bondage, and his hostility to property among rulers is an attempt to solve permanently what Solon solved once by decree."}]}, {"id": "ev-peloponnesian", "name": "Peloponnesian War ends", "year": -404, "kind": "war", "note": "Defeat and the collapse of the democracy is the immediate soil of Plato's hostility to popular rule.", "works": [{"title": "The Republic", "because": "defeat and the collapse of the democracy is why the ideal city is ruled by experts"}, {"title": "The History of the Peloponnesian War", "because": "The book is the defeated empire's account of itself, written by a general it exiled, and its explanatory method comes from having to explain a loss that piety could not."}, {"title": "The Oresteia", "because": "Staged in the years of the Ephialtic reforms and the alliance system that led to the war, it dramatises the transfer of vengeance from families to the courts of a city that was arming."}]}, {"id": "ev-alexander", "name": "Alexander's conquests", "year": -323, "kind": "war", "note": "The polis is absorbed into empire; ethics turns inward because politics is no longer available to the citizen.", "works": [{"title": "Letters and Principal Doctrines", "because": "the polis is gone, so ethics retreats to the garden"}, {"title": "Elements", "because": "Alexandria's library and museum were a Ptolemaic state institution created out of conquest, and the compilation of Greek geometry into a single deductive system was the kind of work only a funded institution does."}, {"title": "On Floating Bodies", "because": "Hellenistic Syracuse and Alexandria supported mechanics because kings wanted engines and harbours, which is why the science advanced and why it stopped when the patronage did."}, {"title": "Almagest", "because": "Ptolemy worked from Babylonian observational records that reached Greek astronomy through the conquest, so the most durable model in Western science was assembled out of an imperial archive."}]}, {"id": "ev-rome-fall", "name": "Deposition of the last western Roman emperor", "year": 476, "kind": "class", "note": "The slave-supplying war machine stops and the colonate hardens into serfdom.", "works": [{"title": "City of God", "because": "Written directly in answer to the sack of Rome and the charge that abandoning the old gods had caused it, and its separation of the two cities is what allowed the church to survive the state that had adopted it."}, {"title": "Mosaics of San Vitale", "because": "With the western administration gone, Ravenna became the point where a surviving eastern empire advertised its claim to the west, and the mosaics are that claim in gold."}]}, {"id": "ev-bayt-hikma", "name": "House of Wisdom, Baghdad", "year": 830, "kind": "technology", "note": "Abbasid surplus funds systematic translation of Greek science, without which there is no European recovery of Aristotle.", "works": [{"title": "The Compendious Book on Calculation by Completion and Balancing", "because": "Abbasid patronage of translation and calculation, tied to taxation and inheritance law"}, {"title": "The Book of Optics", "because": "The Greek optical corpus was available in Arabic because of the translation movement, and Ibn al-Haytham could test it against experiment rather than merely transmit it."}, {"title": "The Canon of Medicine", "because": "A synthesis on this scale presupposes a library of translated Greek, Persian and Indian medicine, which is exactly what the Abbasid translation programme produced."}]}, {"id": "ev-plough", "name": "Heavy plough and three-field rotation generalise", "year": 1000, "kind": "technology", "note": "A rising agrarian surplus feeds towns, universities and a merchant stratum inside the feudal order.", "works": [{"title": "The Canterbury Tales", "because": "the pilgrimage assembles exactly the social layers the commercial revival produced"}, {"title": "Chartres Cathedral", "because": "The agricultural surplus that the heavy plough and three field rotation released is what paid for the twelfth century building boom, and the guild windows record which part of that surplus had moved into the towns."}, {"title": "On the Abbey Church of St-Denis", "because": "Suger could contemplate spending on this scale because the abbey's estates were producing more than they had a century earlier, and his treatise is an argument for what to do with an agrarian surplus."}, {"title": "Micrologus", "because": "Notation was developed in monastic schools that the same rising rural surplus supported, and it solved a problem of scale created by a church with houses across Europe."}]}, {"id": "ev-plague", "name": "Black Death", "year": 1348, "kind": "crisis", "note": "Labour scarcity raises peasant bargaining power, breaks serfdom in western Europe and opens the crisis of feudalism.", "works": [{"title": "The Canterbury Tales", "because": "labour scarcity after the plague is why the Ploughman's brother can talk back"}, {"title": "The Prince", "because": "the crisis of feudal authority is the vacuum the new prince is supposed to fill"}, {"title": "Natural and Political Observations Made upon the Bills of Mortality", "because": "The weekly bills existed as an epidemic early warning system for a city that had learned to fear plague, and Graunt turned an administrative by-product into the first quantitative account of a population."}, {"title": "The Decameron", "because": "The frame is the plague itself, and the confidence of the storytellers belongs to the survivors of a mortality that had just raised the price of labour and loosened seigneurial control."}, {"title": "Piers Plowman", "because": "Written under the labour legislation that followed the plague, and its quarrel with idleness and false pardons is the ideological form of a fight over wages that ended in the revolt of 1381."}]}, {"id": "ev-print", "name": "Gutenberg's press", "year": 1450, "kind": "technology", "note": "Cheap reproduction of text makes both the Reformation and the scientific periodical possible; ideas acquire a means of production.", "works": [{"title": "De Revolutionibus Orbium Coelestium", "because": "the diagram can be reproduced identically, which is what makes it arguable"}, {"title": "First Folio", "because": "a play becomes a book and therefore a canon"}, {"title": "News from Nowhere", "because": "Morris built a press to make books as an argument about how work should feel"}, {"title": "The Disasters of War", "because": "Goya chose etching because prints could circulate and be hidden, which is why the plates survived a censorship that would have destroyed paintings."}, {"title": "The Great Wave off Kanagawa", "because": "A woodblock edition of thousands sold cheaply to Edo townspeople is a print economy operating inside a feudal one."}, {"title": "The People's Charter", "because": "Chartism was held together by the Northern Star and a network of cheap unstamped papers as much as by the six points."}, {"title": "Encyclopedie, ou dictionnaire raisonne des sciences, des arts et des metiers", "because": "Four thousand subscribers and a syndicate of printers could finance and finish a project the crown had twice suppressed, which demonstrates that book production had become an industry with interests of its own."}, {"title": "A Dictionary of the English Language", "because": "A commercial trade rather than an academy standardised written English, because in England the booksellers had the capital and the state did not have the interest."}, {"title": "Dialogue Concerning the Two Chief World Systems", "because": "The danger was not the heliocentrism but the vernacular octavo, which put a contested cosmology into the hands of readers the universities did not control."}, {"title": "Micrographia", "because": "The book sold on its fold-out engravings, and the plate was the technology that let an instrument's results travel further than the instrument could."}, {"title": "Gulliver's Travels", "because": "Swift is writing inside a London print market saturated with projects, prospectuses and subscription schemes, and the satire only lands because his readers had recently lost money to some of them."}, {"title": "Gutenberg Bible", "because": "The first product of the press, and the first European commodity produced by mechanical reproduction on a capitalised venture that failed and was seized by its creditor."}, {"title": "Ninety-five Theses", "because": "A local academic objection became a European movement in weeks because printers found it sold, which makes the Reformation the first political event carried by a mass medium."}, {"title": "Melencolia I", "because": "Durer's living came from printed sheets sold at fairs rather than from a single patron, which is the first time in Europe that an artist's independence rests on a reproduction technology."}, {"title": "Missa Pange Lingua", "because": "Petrucci's printed partbooks created a market in which a composer's name sold music beyond the chapel that employed him, and Josquin was the first to benefit from it."}, {"title": "Four Books of Architecture", "because": "The treatise is designed to be copied from, which only makes sense once plans and measurements can be reproduced exactly and sold to patrons the architect will never meet."}, {"title": "Lives of the Artists", "because": "Vasari could assemble and circulate a canon because print made a shared list of names possible, and art history begins as a printed argument about rank."}]}, {"id": "ev-1492", "name": "Colonial conquest of the Americas begins", "year": 1492, "kind": "class", "note": "Plunder, silver and the slave trade supply the money capital Marx calls primitive accumulation.", "works": [{"title": "Novum Organum", "because": "navigation, mining and gunnery set the problems the new method is built to solve"}, {"title": "Narrative of the Life of Frederick Douglass, an American Slave", "because": "The plantation Douglass describes is the mature form of the Atlantic system that began with the Caribbean sugar colonies."}, {"title": "Incidents in the Life of a Slave Girl", "because": "The reproduction of enslaved people as capital was the American answer to the closing of the Atlantic trade."}, {"title": "Uncle Tom's Cabin", "because": "Written against the Fugitive Slave Act, which extended the plantation's legal reach into the free states."}, {"title": "Slave Songs of the United States", "because": "Collected in the Sea Islands, on plantations abandoned by their owners, at the moment the system that produced the music collapsed."}, {"title": "On the Origin of Species", "because": "Darwin's evidence came from a naval survey whose purpose was charting the trade routes of an empire built on the Atlantic system."}, {"title": "Las Meninas", "because": "The court Velazquez paints was financed by American bullion whose purchasing power had already collapsed, so the picture's magnificence is being staged by a monarchy that had defaulted repeatedly within living memory."}, {"title": "Don Quixote", "because": "Silver made Spain rich without making it productive, ruining exactly the small gentry Cervantes came from, and the knight's obsolescence is a class experience before it is a joke."}, {"title": "Still Life with a Gilt Cup", "because": "Every object on the table is an import or a manufacture dependent on one, so the genre is a record of what the carrying trade had made ordinary in a Dutch merchant's dining room."}, {"title": "Flower Still Life", "because": "The species Ruysch paints together never bloomed in the same season or the same continent, which is precisely the point: the bouquet is a portfolio of what the trading companies could source."}, {"title": "Amsterdam Canal Ring", "because": "The city expanded threefold in one generation on the profits of long distance trade, and the ring is the physical form of a merchant class investing its returns in urban land."}, {"title": "Metamorphosis Insectorum Surinamensium", "because": "Merian could only do the work because Dutch Surinam existed and would receive her, and the plantation economy supplied both her transport and the enslaved and indigenous informants she depended on."}, {"title": "Systema Naturae", "because": "The problem Linnaeus solved was created by colonial collecting: specimens were arriving faster than European naturalists could name them, and a name is an administrative device before it is a scientific one."}, {"title": "Oroonoko", "because": "Behn had been in Surinam when it was English, and the novella is written out of a colony changing hands and a sugar economy that already ran on African labour."}, {"title": "Robinson Crusoe", "because": "Crusoe is shipwrecked on a slaving voyage, owns a Brazilian plantation, and returns to collect its profits, which makes the great fable of self-reliance a merchant's account of the Atlantic circuit."}, {"title": "Candide", "because": "The mutilated slave at the Surinam mill is the moment the book stops being funny, and Voltaire put him there because the sugar in a Paris coffee house had a traceable origin everyone preferred not to trace."}, {"title": "Thoughts and Sentiments on the Evil of Slavery", "because": "Cugoano was taken from the Gold Coast and sold in Grenada, and the pamphlet's demand for immediate abolition with compensation to the enslaved comes from that experience rather than from the reformist calculation of his allies."}, {"title": "The Interesting Narrative of the Life of Olaudah Equiano", "because": "The book exists because a man who had been a commodity in the Atlantic trade acquired enough capital within it to buy himself and then to publish, which is an argument the trade could not answer."}, {"title": "Poems on Various Subjects, Religious and Moral", "because": "Wheatley was shipped from Senegambia to Boston as a child and named after the vessel that carried her, and the book was published in London because the colonial market that produced her would not print her."}, {"title": "A Short Account of the Destruction of the Indies", "because": "A direct account of the first phase of colonial extraction, written to influence the Spanish crown's policy on the encomienda, by a participant turned prosecutor."}, {"title": "Florentine Codex", "because": "Compiled to make evangelisation among the Nahua more effective after the conquest, which is why the fullest record of Mexica society exists at all."}, {"title": "World Map on the Mercator Projection", "because": "The projection exists because Atlantic shipping needed constant compass bearings drawn as straight lines, and it spread with the trade that funded it."}, {"title": "Essays", "because": "Of Cannibals is written out of the reports and the captives brought back from Brazil, and turns the encounter into a question about the barbarism of the society doing the conquering."}]}, {"id": "ev-reformation", "name": "Luther's theses", "year": 1517, "kind": "class", "note": "The first mass ideological break with the feudal church, carried by print and by princes who want church land.", "works": [{"title": "The Peasant War in Germany", "because": "the class content underneath the theological quarrel"}, {"title": "The Calling of Saint Matthew", "because": "Trent explicitly instructed that images should move the unlettered, and Caravaggio was hired to do exactly that in a parish church for a public the church was competing to keep."}, {"title": "Judith Slaying Holofernes (Gentileschi)", "because": "The market for violent Old Testament subjects was a counter-reformation market, and it gave a woman painter access to commissions that a purely decorative tradition would not have."}, {"title": "Sant'Ivo alla Sapienza", "because": "Rome kept spending on churches at a rate its shrinking economy could not justify because architecture was one of the few arenas in which the papacy could still act like a great power."}, {"title": "St Matthew Passion", "because": "Lutheran towns made congregational music a civic institution with a salaried staff and an annual liturgical calendar, and Bach's job description is a direct product of that settlement."}, {"title": "Ethics", "because": "The confessional wars produced, in the Dutch Republic, a state that tolerated heterodoxy because it was commercially inconvenient to suppress it, and that narrow opening is where Spinoza's argument became sayable."}, {"title": "Sermon to the Princes", "because": "Muntzer takes the break with Rome as a licence for the plebeian and peasant demands that Luther refused, and preaches it to the princes he would shortly be fighting."}, {"title": "Institutes of the Christian Religion", "because": "The systematic doctrine the movement needed once it had to govern cities rather than merely protest, and it was written in and for the commercial towns that adopted it."}, {"title": "Missa Papae Marcelli", "because": "The Council of Trent's response to the Reformation included regulating church music for intelligibility, and Palestrina's mass became the demonstration that polyphony could comply."}, {"title": "Sistine Chapel ceiling", "because": "The Roman building programme the ceiling belongs to was funded by the indulgence sales that provoked the revolt, so the two are opposite ends of one fiscal operation."}]}, {"id": "ev-enclosure", "name": "English enclosures accelerate", "year": 1550, "kind": "class", "note": "Peasants are separated from the land, creating the propertyless class that wage labour requires.", "works": [{"title": "Leviathan", "because": "a society of masterless men needs a theory of why anyone obeys"}, {"title": "Lyrical Ballads", "because": "The vagrants, discharged soldiers and abandoned women of the ballads are the human output of parliamentary enclosure."}, {"title": "An Essay on the Principle of Population", "because": "Malthus writes as enclosure and a bad harvest push poor rates up, and supplies the argument for cutting them."}, {"title": "The Hay Wain", "because": "Constable paints a settled agrarian order in Suffolk in the decade when it was being dismantled around him."}, {"title": "The Gleaners", "because": "Gleaning was a customary right being extinguished by French landowners exactly as Millet monumentalised it."}, {"title": "London Labour and the London Poor", "because": "Mayhew's street population is rural dispossession arriving in the metropolis with no factory to absorb it."}, {"title": "The True Levellers Standard Advanced", "because": "Digging on St George's Hill was a direct response to the fencing of commons and waste, and the pamphlet argues from the customary right that enclosure was extinguishing rather than from any doctrine of equality."}, {"title": "Mr and Mrs Andrews", "because": "The consolidated fields, the new fencing and the gun are the picture's actual subject, and portraiture is being asked to make a recent legal transfer of common right look like an inherited landscape."}, {"title": "An Inquiry into the Nature and Causes of the Wealth of Nations", "because": "The labour that Smith finds available for the division of labour had to be separated from the land first, and his account of that separation as natural progress is the book's largest silence."}, {"title": "Gin Lane", "because": "The London poor Hogarth draws were substantially a rural population pushed off the land within living memory, and the moral panic about spirits is a panic about a labour force nobody was yet organising in factories."}, {"title": "Theory of the Earth", "because": "Hutton reasoned from the soil of an improved lowland farm he was managing himself, and the cyclical repair of the earth is the improving landlord's idea of maintenance projected onto geology."}, {"title": "Discourse on the Origin of Inequality", "because": "The image of the first man who fenced a plot is not a metaphor drawn from nowhere, it is the visible European transformation of the eighteenth century read backwards into prehistory."}, {"title": "The Royal Crescent, Bath", "because": "The class that took the leases lived on agricultural rents and colonial appointments, and the Crescent is what that income looks like when it stops going into country houses and starts buying a season in town."}, {"title": "Utopia", "because": "Book One is a description of enclosure, depopulation and the hanging of the dispossessed, and the communism of Book Two is the answer it generates."}, {"title": "The Peasant Wedding", "because": "Painted for Antwerp buyers whose wealth came from a countryside being reorganised for the market, and the peasants in it are becoming a subject for painting at the point they are becoming a problem for landlords."}]}, {"id": "ev-english-rev", "name": "English Revolution", "year": 1649, "kind": "revolution", "note": "Commercial property takes the state. The Levellers and Diggers mark the first appearance of a plebeian left wing inside a bourgeois revolution.", "works": [{"title": "Leviathan", "because": "written in exile from the revolution it is trying to explain away"}, {"title": "Paradise Lost", "because": "the defeated republic's secretary writing about a failed rebellion"}, {"title": "The People's Charter", "because": "The Charter's demands restate the Levellers' Agreement of the People, a lineage the Chartists claimed for themselves."}, {"title": "On Liberty", "because": "Mill's defence of dissent draws on a tradition of toleration argument that the English Revolution and its aftermath created."}, {"title": "An Agreement of the People", "because": "An army that had beaten the king and had not been paid needed a written answer to the question of what it had fought for, and no existing constitutional vocabulary supplied one. The document exists because the New Model was a standing political body before it was disbanded."}, {"title": "The Law of Freedom in a Platform", "because": "The collapse of censorship between 1641 and 1660 briefly made it possible to print a plan for abolishing the sale of land and labour and address it to the head of state. Winstanley wrote a constitution rather than a prophecy because for a few years it looked as though someone might implement one."}, {"title": "Two Treatises of Government", "because": "The settlement of 1688 needed a justification that was neither divine right nor popular sovereignty, and Locke supplied one anchored in property that had been safe under both Stuarts and Cromwell."}, {"title": "The Sceptical Chymist", "because": "The Royal Society was chartered in 1662 by a restored monarchy that wanted natural philosophy visibly separated from the sectarian enthusiasm of the previous twenty years. Boyle's careful experimental protocol is partly a political manner."}, {"title": "St Paul's Cathedral", "because": "The Anglican establishment restored in 1660 needed a monument that was neither Roman nor Puritan, and the Fire gave it the site and the coal duty gave it the money."}, {"title": "A Serious Proposal to the Ladies", "because": "Once resistance to arbitrary power had been publicly argued and won, the argument was available to anyone who could read it, including women it had never been meant to reach. Astell's Toryism makes that leakage more striking, not less."}]}, {"id": "ev-steam", "name": "Watt's separate condenser", "year": 1769, "kind": "technology", "note": "Power is freed from water sites; the factory can be sited where labour is, and the industrial proletariat is concentrated in cities.", "works": [{"title": "The Wealth of Nations", "because": "the division of labour is observed in manufacture just as machinery begins to supersede it"}, {"title": "The Condition of the Working Class in England", "because": "Manchester, where Engels was sent to run the family firm"}, {"title": "Capital, Volume 1", "because": "the factory system and the Blue Books that documented it are the book's evidence base"}, {"title": "Reflections on the Motive Power of Fire", "because": "Carnot set out to explain why British engines were more efficient than French ones and derived a limit on all of them."}, {"title": "On the Mechanical Equivalent of Heat", "because": "Joule measured in a brewery, using the thermometry of a trade that already lived by converting fuel into work."}, {"title": "Hard Times", "because": "Coketown is a composite of the Lancashire mill towns Dickens visited during the Preston strike of 1853."}, {"title": "Mary Barton", "because": "The novel's crisis is a trade depression in a city whose entire employment structure depended on the power loom."}, {"title": "Frankenstein", "because": "The fear of an assembled being that turns on its maker belongs to the decade of machine-breaking and its judicial hangings."}, {"title": "Rain, Steam and Speed", "because": "Turner painted the Great Western at the height of the railway mania, when the network was being laid faster than it could be financed."}, {"title": "The Crystal Palace", "because": "Only an economy with mass sheet glass, standardised iron and a national railway to deliver them could have built it in nine months."}, {"title": "Notes on the Analytical Engine", "because": "Babbage's engine and Lovelace's reading of it come out of the same mechanisation of skilled hand work that produced the Jacquard loom."}, {"title": "The Stones of Venice", "because": "Ruskin's defence of the workman's freedom is unintelligible except as a reaction to factory production of ornament."}, {"title": "The Palace of Westminster", "because": "The medieval detail was mass-produced by Minton and Hardman in industrial quantities, which is the contradiction the building is made of."}, {"title": "Capital, Volume I", "because": "The chapters on machinery and the working day are written from the factory inspectors' reports that steam-powered production made necessary."}, {"title": "The Iron Bridge, Coalbrookdale", "because": "Coke smelting made cast iron cheap enough to use structurally, and the Darbys built the bridge partly as a demonstration to potential customers of what the material could do."}, {"title": "An Experiment on a Bird in the Air Pump", "because": "Wright's patrons were the men building engines and mills in the Midlands, and the painting flatters them by making the manipulation of air and vacuum look like the central drama of the age, which for them it was."}]}, {"id": "ev-french-rev", "name": "French Revolution", "year": 1789, "kind": "revolution", "note": "The decisive bourgeois revolution. Its radical phase and its defeat set the terms for every subsequent argument about reform, terror and the state.", "works": [{"title": "Phenomenology of Spirit", "because": "the terror is the section on absolute freedom, written in Jena as Napoleon arrives"}, {"title": "A Vindication of the Rights of Woman", "because": "written into the argument the revolution opened about who the rights are for"}, {"title": "Reflections on the Revolution in France", "because": "Written in 1790 as an alarm call to the English landed interest, before the Terror it is usually credited with predicting."}, {"title": "Rights of Man", "because": "Paine wrote it to defend the revolution in England and priced it for artisans, which is why the government prosecuted the price as much as the argument."}, {"title": "Theorie des quatre mouvements", "because": "Fourier's scheme is a response to a revolution he judged to have changed the state and left the organisation of labour intact."}, {"title": "Nouveau christianisme", "because": "Saint-Simon watched the revolution destroy the clergy and spent his life designing a replacement priesthood of engineers."}, {"title": "Symphony No. 3 (Eroica)", "because": "The dedication to Bonaparte and its erasure record the exact moment the revolution turned into an empire."}, {"title": "Lectures on Aesthetics", "because": "Hegel's whole periodisation of art assumes that a world-historical rupture has just occurred and that thought arrives after it."}, {"title": "The Third of May 1808", "because": "The Napoleonic occupation of Spain is the revolution arriving as an army, and Goya paints what it did to the people it came to liberate."}, {"title": "Liberty Leading the People", "because": "The July revolution of 1830 is the bourgeoisie collecting on 1789 without conceding anything to the crowd that fought for it."}, {"title": "Constitution of Saint-Domingue", "because": "The rights of man were proclaimed in Paris by an assembly full of men with colonial investments, and the colony took them literally, which is the sense in which 1789 produced a document its authors would have refused to sign."}]}, {"id": "ev-haiti", "name": "Haitian Revolution", "year": 1804, "kind": "revolution", "note": "The only successful slave revolution founds a state and exposes the racial limit of the rights of man.", "works": [{"title": "Appeal to the Coloured Citizens of the World", "because": "Walker writes for readers who knew that enslaved people had already defeated a European army, which is what makes the pamphlet a threat rather than a plea."}, {"title": "The Slave Ship", "because": "Turner exhibited it in the year of the world anti-slavery convention, when British abolitionism was busy forgetting that the decisive blow had been struck by the enslaved themselves."}, {"title": "Constitution of Saint-Domingue", "because": "A general risen from slavery had to write down what the revolution had won before France could take it back, and the document's compulsory labour clauses show a state that has abolished slavery but not the sugar economy it depends on."}]}, {"id": "ev-peterloo", "name": "Peterloo massacre", "year": 1819, "kind": "class", "note": "Mass working class assembly is met with cavalry; English radicalism is forced towards independent class organisation.", "works": [{"title": "The Mask of Anarchy", "because": "Written directly out of the Manchester killings and unpublishable while the Six Acts stood."}, {"title": "A Defence of Poetry", "because": "Shelley's claim for poetry's political function is made from exile in the repression that followed 1819."}]}, {"id": "ev-1848", "name": "Revolutions of 1848", "year": 1848, "kind": "revolution", "note": "The bourgeoisie shows it will side with reaction against the workers. Marx and Engels draw the conclusion that the proletariat must act independently.", "works": [{"title": "The Class Struggles in France, 1848-1850", "because": "written as the events happen, then corrected against them"}, {"title": "Address of the Central Committee to the Communist League", "because": "the permanent revolution formulation comes directly out of the defeat"}, {"title": "The Peasant War in Germany", "because": "1525 read through 1848: the peasantry cannot lead, and cannot be ignored"}, {"title": "The Stone Breakers", "because": "painted the year after the June days, by a man who would sit on the Commune"}, {"title": "The Communist Manifesto", "because": "Commissioned by the Communist League and in print in London weeks before the February revolution in Paris."}, {"title": "The Eighteenth Brumaire of Louis Bonaparte", "because": "It is an autopsy on the defeat of 1848 written while the survivors were still arguing about who lost it."}, {"title": "Declaration of Sentiments", "because": "Seneca Falls met in July 1848 in a transatlantic year of conventions and risings, and used the same repertoire."}, {"title": "Instructions pour une prise d'armes", "because": "Blanqui's manual is the lesson he drew from the June days, that spontaneous crowds lose to organised troops."}, {"title": "A Burial at Ornans", "because": "A provincial republican community given monumental treatment as the republic itself was being dismantled from Paris."}, {"title": "Der Ring des Nibelungen", "because": "Wagner began the cycle on the run from a Dresden warrant after the May rising, and its politics never entirely recovered from the exile."}, {"title": "Mary Barton", "because": "Published in the year of the last great Chartist petition, it addresses a middle-class readership that had just been badly frightened."}]}, {"id": "ev-origin", "name": "Publication of On the Origin of Species", "year": 1859, "kind": "technology", "note": "History enters nature. Engels treats it as the natural-scientific counterpart of the materialist conception of history.", "works": [{"title": "Dialectics of Nature", "because": "Engels takes Darwin as the natural-scientific counterpart of the materialist conception of history"}, {"title": "The Part Played by Labour in the Transition from Ape to Man", "because": "labour, not the brain, as the driver of hominisation"}, {"title": "The Selfish Gene", "because": "Darwinism recast at the level of the gene, and widely read as a claim about society"}, {"title": "Experiments on Plant Hybridisation", "because": "Mendel read Darwin and designed his crosses against the inheritance problem the Origin had left open."}, {"title": "Middlemarch", "because": "Eliot writes gradual causation and environmental determination into the novel form a decade after natural selection made them common sense."}, {"title": "Capital, Volume I", "because": "Marx sent Darwin a copy and modelled his history of technology on a natural history of organs, which is a debt and a method rather than a compliment."}]}, {"id": "ev-commune", "name": "Paris Commune", "year": 1871, "kind": "revolution", "note": "The first workers government. Marx rewrites the theory of the state around it: the existing machinery cannot simply be taken over.", "works": [{"title": "The Civil War in France", "because": "the working class cannot simply lay hold of the ready-made state machinery"}]}, {"id": "ev-scramble", "name": "Berlin Conference and the partition of Africa", "year": 1885, "kind": "class", "note": "Territorial division of the world by the great powers, the material fact the imperialism debate is about.", "works": [{"title": "Imperialism: A Study", "because": "the partition of Africa is the fact the whole debate is about"}, {"title": "Heart of Darkness", "because": "Leopold's Congo, seen by a steamboat captain who went there"}, {"title": "The Peasant Question in France and Germany", "because": "written as the export of capital reorganises the world market the peasantry sells into"}, {"title": "Les Demoiselles d'Avignon", "because": "the masks in the Trocadero got to Paris the way rubber and ivory did"}]}, {"id": "ev-1905", "name": "Russian Revolution of 1905", "year": 1905, "kind": "revolution", "note": "The soviet appears as a spontaneous form of workers power and prompts Trotsky's theory of permanent revolution.", "works": [{"title": "The Mass Strike, the Political Party and the Trade Unions", "because": "written directly out of the Russian events, against German caution"}, {"title": "Results and Prospects", "because": "the soviet appears, and the theory of permanent revolution appears with it"}, {"title": "Mother", "because": "written on the road after the defeat, to raise money for the party"}]}, {"id": "ev-ww1", "name": "First World War", "year": 1914, "kind": "war", "note": "The Second International collapses into national defencism. The split between reform and revolution becomes organisational.", "works": [{"title": "Imperialism, the Highest Stage of Capitalism", "because": "written in Zurich to explain why the parties of the International voted for war credits"}, {"title": "The State and Revolution", "because": "the state that could conscript a continent had to be theorised before it could be broken"}, {"title": "Conspectus of Hegel's Science of Logic", "because": "the notebooks are what a defeat does to a theorist with time in a library"}]}, {"id": "ev-1917", "name": "Russian Revolution", "year": 1917, "kind": "revolution", "note": "Workers power in a backward country. Its isolation, and the bureaucratic reaction that follows, dominates twentieth century Marxism.", "works": [{"title": "The State and Revolution", "because": "the pamphlet breaks off because the revolution interrupted it"}]}, {"id": "ev-1929", "name": "Wall Street crash and the Depression", "year": 1929, "kind": "crisis", "note": "Mass unemployment discredits liberal economics and produces both Keynes and the fascist alternative.", "works": []}, {"id": "ev-1933", "name": "Nazi seizure of power", "year": 1933, "kind": "class", "note": "Defeat without a fight, the result of the KPD's refusal of the united front. It drives the emigration that becomes the Frankfurt School.", "works": []}, {"id": "ev-ww2", "name": "Second World War ends", "year": 1945, "kind": "war", "note": "Destruction of capital, US hegemony and the arms economy underwrite an exceptional boom.", "works": []}, {"id": "ev-1956", "name": "Khrushchev's secret speech and the Hungarian revolution", "year": 1956, "kind": "class", "note": "The Western communist parties lose their moral monopoly; a New Left forms in the gap.", "works": []}, {"id": "ev-decol", "name": "Decolonisation peaks in Africa", "year": 1960, "kind": "revolution", "note": "Formal independence without economic independence, which is what dependency theory sets out to explain.", "works": []}, {"id": "ev-1968", "name": "May 1968 and the global revolt", "year": 1968, "kind": "revolution", "note": "The largest general strike in history is contained by the PCF. The defeat pushes a generation of intellectuals away from the working class as the agent of change.", "works": []}, {"id": "ev-1973", "name": "End of Bretton Woods and the oil shock", "year": 1973, "kind": "crisis", "note": "The post-war boom ends. The long downturn begins and with it the neoliberal counter-offensive.", "works": []}, {"id": "ev-1984", "name": "Miners strike defeated in Britain", "year": 1985, "kind": "class", "note": "The decisive defeat of the strongest battalion of the British working class, and the condition for everything Thatcherism did afterwards.", "works": []}, {"id": "ev-1989", "name": "Collapse of the Stalinist states", "year": 1989, "kind": "class", "note": "Capitalist restoration is presented as the end of history, throwing the workers movement back ideologically for a generation.", "works": []}, {"id": "ev-2008", "name": "Global financial crisis", "year": 2008, "kind": "crisis", "note": "Ends the intellectual monopoly of the market and revives interest in Marx's crisis theory without producing a mass alternative.", "works": []}, {"id": "ev-2020", "name": "Pandemic and the return of state intervention", "year": 2020, "kind": "crisis", "note": "States suspend market orthodoxy overnight, demonstrating a capacity for planning that is denied when labour asks for it.", "works": []}], "domainOrder": ["philosophy", "science", "economics", "politics", "literature", "art"], "domainLabel": {"philosophy": "Philosophy", "science": "Science and mathematics", "economics": "Political economy", "politics": "Politics and the movement", "literature": "Literature", "art": "Art, music, architecture"}, "linkStyle": {"influenced": null, "presupposes": "9 3", "responds to": "5 4", "same debate": "2 4", "method parallel": "8 3 1 3", "literary companion": "1 3", "arises from": null}, "linkOrder": ["influenced", "presupposes", "responds to", "same debate", "method parallel", "literary companion", "arises from"], "light": {"literature": "#c54300", "economics": "#acb43d", "science": "#009c98", "philosophy": "#006db8", "art": "#8f8de0", "politics": "#914473"}, "dark": {"literature": "#ac3500", "economics": "#a3941d", "science": "#00897a", "philosophy": "#2d99e7", "art": "#6656d7", "politics": "#d263b4"}, "built": "2026-08-19"};
const NS="http://www.w3.org/2000/svg";
const byId=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const evById=Object.fromEntries(D.events.map(e=>[e.id,e]));
let theme="light", pal=D.light;
let Z=1;
let active=new Set(D.domainOrder), sel=null, showAll=false, unreadOnly=false, query="";
const isRead=n=>(n.status||"").toLowerCase()==="read";

/* ---------- piecewise time scale: antiquity is not crushed ---------- */
const SEG=[[-2400,-800,.34],[-800,-300,1.9],[-300,500,.78],[500,1300,.42],
           [1300,1600,1.5],[1600,1750,3.2],[1750,1850,9],[1850,1920,20],
           [1920,1970,10],[1970,2027,8]];
const PAD=150;
function xOf(y){
  y=Math.max(SEG[0][0],Math.min(2026,y)); let x=PAD;
  for(const[a,b,k]of SEG){ if(y>=b){x+=(b-a)*k;} else {x+=Math.max(0,(y-a))*k; break;} }
  return x;
}
const W=xOf(2026)+PAD+40;

/* ---------- lane geometry, driven by how many rows the labels need ---------- */
const LANE_TOP=52, ROW=17, BASE_H=132;
let MAXROW=200, allNames=true;
function labelW(n){ return showLabel(n)? (Math.min(n.name.length,46)*5.6+16) : 13; }
function showLabel(n){ return allNames || n.weight>=4; }
let lanes={}, POS={}, LANE_BOTTOM=0, H=0;
function pack(){
  const rowOf={}, used={};
  for(const d of D.domainOrder){
    const ns=D.nodes.filter(n=>n.domain===d).sort((a,b)=>(b.weight-a.weight)||(a.year-b.year));
    const rowEnd=[];
    for(const n of ns){
      const x=xOf(n.year), w=labelW(n);
      let best=null;
      for(let r=0;r<rowEnd.length;r++){ if(x-8>rowEnd[r]){best=r;break;} }
      if(best===null){ if(rowEnd.length<MAXROW){best=rowEnd.length;rowEnd.push(-1e9);}
                       else best=rowEnd.indexOf(Math.min(...rowEnd)); }
      rowEnd[best]=x+w+10;
      rowOf[n.id]=best;
    }
    used[d]=Math.max(3,rowEnd.length);
  }
  lanes={}; let y=LANE_TOP;
  for(const d of D.domainOrder){ lanes[d]={y0:y,rows:used[d],h:used[d]*ROW+22}; y+=lanes[d].h; }
  LANE_BOTTOM=y; H=y+BASE_H;
  POS={};
  for(const n of D.nodes){ if(rowOf[n.id]===undefined)continue;
    POS[n.id]={x:xOf(n.year),y:lanes[n.domain].y0+15+rowOf[n.id]*ROW,row:rowOf[n.id]}; }
}
pack();

/* ---------- render ---------- */
const svg=document.getElementById("svg");
let gutter=null;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function syncGutter(){ if(gutter) gutter.setAttribute("transform",
  `translate(${document.getElementById("scroll").scrollLeft/Z},0)`); }
document.getElementById("scroll").addEventListener("scroll",syncGutter,{passive:true});
function draw(){
  svg.innerHTML=""; svg.setAttribute("width",Math.round(W*Z));
  svg.setAttribute("height",Math.round(H*Z));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const gBands=el("g",{},svg), gGrid=el("g",{},svg), gEdge=el("g",{},svg),
        gNode=el("g",{},svg), gLane=el("g",{},svg), gBase=el("g",{},svg);

  D.periods.forEach((p,i)=>{
    const x0=xOf(p.start), x1=xOf(p.end);
    el("rect",{x:x0,y:LANE_TOP-24,width:x1-x0,height:LANE_BOTTOM-LANE_TOP+24,
      fill:i%2?"var(--band2)":"var(--band)",opacity:.55},gBands);
    el("line",{x1:x0,y1:LANE_TOP-24,x2:x0,y2:H-18,stroke:"var(--axis)","stroke-width":1,opacity:.6},gGrid);
    const t=el("text",{x:x0+7,y:LANE_TOP-9,class:"pername"},gBands); t.textContent=p.name;
  });
  for(let yr=-2000;yr<=2000;yr+=100){
    if(yr<-800&&yr%500)continue; if(yr<500&&yr%200&&yr>-800)continue;
    const x=xOf(yr);
    el("line",{x1:x,y1:LANE_TOP,x2:x,y2:LANE_BOTTOM,stroke:"var(--grid)","stroke-width":1},gGrid);
    const t=el("text",{x:x+3,y:H-BASE_H+14,class:"axtick"},gGrid);
    t.textContent=yr<0?Math.abs(yr)+" BCE":yr;
  }
  for(const d of D.domainOrder){
    const L=lanes[d];
    el("line",{x1:0,y1:L.y0+L.h-4,x2:W,y2:L.y0+L.h-4,stroke:"var(--grid)","stroke-width":1},gLane);
  }
  gutter=el("g",{id:"gutter"},gLane);
  el("rect",{x:0,y:LANE_TOP-26,width:PAD-14,height:LANE_BOTTOM-LANE_TOP+26,
    fill:"var(--surface)",opacity:.97},gutter);
  el("line",{x1:PAD-14,y1:LANE_TOP-26,x2:PAD-14,y2:LANE_BOTTOM,stroke:"var(--grid)"},gutter);
  for(const d of D.domainOrder){
    const L=lanes[d];
    const t=el("text",{x:8,y:L.y0+11,class:"lanelabel"},gutter);
    D.domainLabel[d].toUpperCase().split(" ").forEach((w,i)=>{
      const ts=el("tspan",{x:8,dy:i?12:0},t); ts.textContent=w; });
    t.setAttribute("fill",pal[d]); t.setAttribute("opacity",active.has(d)?1:.35);
  }
  syncGutter();

  /* base layer: material events */
  const bY=H-BASE_H+30;
  el("line",{x1:0,y1:bY-8,x2:W,y2:bY-8,stroke:"var(--axis)","stroke-width":1.5},gBase);
  const evRows=new Array(4).fill(-1e9);
  D.events.forEach(ev=>{
    const x=xOf(ev.year); let r=0;
    for(r=0;r<4;r++){ if(x-6>evRows[r])break; } if(r===4)r=0;
    evRows[r]=x+ev.name.length*5.1+16;
    const yy=bY+8+r*22;
    el("line",{x1:x,y1:bY-8,x2:x,y2:yy-7,stroke:"var(--axis)","stroke-width":1,opacity:.8},gBase);
    const c=el("rect",{x:x-3.5,y:yy-11,width:7,height:7,rx:1.5,
      fill:ev.kind==="revolution"?"var(--ink)":"var(--muted)",transform:`rotate(45 ${x} ${yy-7.5})`},gBase);
    const t=el("text",{x:x+7,y:yy-3,class:"evname"},gBase); t.textContent=ev.name;
    c.style.cursor="pointer"; t.style.cursor="pointer";
    [c,t].forEach(n=>{ n.onclick=()=>showEvent(ev);
      n.onmouseenter=e=>tip(e,ev.name,ev.year<0?Math.abs(ev.year)+" BCE":ev.year,ev.note);
      n.onmouseleave=hideTip; });
  });

  /* edges */
  const drawEdge=(e,strong)=>{
    const a=POS[e.src]||evPos(e.src), b=POS[e.dst]; if(!a||!b)return;
    const na=byId[e.src], nb=byId[e.dst]; if(!nb)return;
    if(na && !active.has(na.domain))return;
    if(!active.has(nb.domain))return;
    const mx=(a.x+b.x)/2, dy=Math.abs(b.y-a.y);
    const p=`M${a.x},${a.y} C${mx},${a.y-Math.min(60,dy*.5)} ${mx},${b.y-Math.min(60,dy*.5)} ${b.x},${b.y}`;
    const dash=D.linkStyle[e.type];
    const stroke = na ? pal[na.domain] : "var(--ink2)";
    const path=el("path",{d:p,fill:"none",stroke:stroke,
      "stroke-width":strong?(na?2:2.4):1,opacity:strong?.85:.14,"stroke-linecap":"round"},gEdge);
    if(dash)path.setAttribute("stroke-dasharray",dash);
  };
  function evPos(id){ const ev=evById[id]; if(!ev)return null;
    return {x:xOf(ev.year), y:H-BASE_H+22}; }
  if(showAll&&!sel) D.edges.forEach(e=>drawEdge(e,false));
  if(sel) D.edges.filter(e=>e.src===sel||e.dst===sel).forEach(e=>drawEdge(e,true));

  /* nodes */
  const rel=sel?new Set(D.edges.filter(e=>e.src===sel||e.dst===sel).flatMap(e=>[e.src,e.dst])):null;
  D.nodes.forEach(n=>{
    const p=POS[n.id]; if(!p)return;
    const on=active.has(n.domain)&&(!unreadOnly||!isRead(n))&&(!query||match(n));
    const g=el("g",{},gNode);
    if(!on){g.setAttribute("class","dim");}
    else if(sel&&!rel.has(n.id)){g.setAttribute("class","dim");}
    const r=1.7+n.weight*1.05;
    const st=(n.status||"").toLowerCase();
    const read=st==="read", reading=st==="reading", next=st==="next";
    const c=el("circle",{cx:p.x,cy:p.y,r:r,
      fill:read||reading?pal[n.domain]:"var(--surface)",
      stroke:pal[n.domain],"stroke-width":read?1:next?2.2:1.3,class:"nd"},g);
    if(reading) el("circle",{cx:p.x,cy:p.y,r:Math.max(1,r-2),fill:"var(--surface)",
      "pointer-events":"none"},g);
    if(n.id===sel){c.setAttribute("stroke","var(--ink)");c.setAttribute("stroke-width",2.5);}
    if(showLabel(n)||n.id===sel||(sel&&rel.has(n.id))){
      const t=el("text",{x:p.x+r+4,y:p.y+3.6,class:"nlabel"+(n.weight>=5?" big":"")},g);
      t.textContent=n.name.length>46?n.name.slice(0,44)+"…":n.name;
      if(read)t.setAttribute("opacity",.72);
    }
    c.onclick=()=>select(n.id);
    c.onmouseenter=e=>tip(e,n.name,(n.person?n.person+" · ":"")+(n.year_disp||n.year),n.note);
    c.onmouseleave=hideTip;
  });
}
function match(n){const q=query.toLowerCase();return n.name.toLowerCase().includes(q)||(n.person||"").toLowerCase().includes(q);}

/* ---------- side panel ---------- */
function select(id){
  sel=(sel===id?null:id); draw(); renderPanel();
  if(sel&&matchMedia("(max-width:760px)").matches&&POS[sel]){
    document.getElementById("scroll").scrollTo({top:Math.max(0,POS[sel].y*Z-46),behavior:"smooth"});
  }
}
function periodOf(n){ return D.periods.find(p=>p.id===n.era); }
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const PB=()=>document.getElementById("panelbody");
const CTR=()=>Math.min(500,document.getElementById("scroll").clientWidth*0.42);
function renderPanel(){
  const a=document.getElementById("panel");
  if(!sel){a.classList.add("hidden");return;}
  a.classList.remove("hidden");
  const n=byId[sel], p=periodOf(n);
  const mat=D.edges.filter(e=>e.dst===sel&&evById[e.src]);
  const ins=D.edges.filter(e=>e.dst===sel&&byId[e.src]), outs=D.edges.filter(e=>e.src===sel&&byId[e.dst]);
  const matRows=mat.map(e=>{const ev=evById[e.src];
    return `<button class="lnk" data-ev="${ev.id}" style="border-left-color:var(--ink2)">
      ${esc(ev.name)}<span class="rel"> · ${ev.year<0?Math.abs(ev.year)+" BCE":ev.year}${e.note?" · "+esc(e.note):""}</span></button>`;}).join("");
  const rowsFor=(list,dir)=>list.map(e=>{
    const o=byId[dir==="in"?e.src:e.dst]; if(!o)return "";
    return `<button class="lnk" data-go="${o.id}" style="border-left-color:${pal[o.domain]}">
      ${esc(o.name)}<span class="rel"> · ${esc(o.person||"")} ${o.year_disp||o.year} · ${e.type}${e.note?" · "+esc(e.note):""}</span></button>`;
  }).join("");
  const st=(n.status||"");
  PB().innerHTML=`
    <h2>${esc(n.name)}</h2>
    <div class="by">${esc(n.person||"")} ${n.year_disp?"· "+esc(n.year_disp):""}</div>
    <div class="meta">
      <span class="tag dom" style="background:${pal[n.domain]}">${D.domainLabel[n.domain]}</span>
      ${st?`<span class="tag${st.toLowerCase()==="read"?" read":""}">${esc(st)}</span>`:""}
      ${n.category?`<span class="tag">${esc(n.category)}</span>`:""}
      ${n.difficulty?`<span class="tag">${esc(n.difficulty)}</span>`:""}
      <span class="tag">weight ${n.weight}</span>
      ${n.own?`<span class="tag">own a copy</span>`:""}
      ${n.order?`<span class="tag">reading order #${n.order}</span>`:""}
    </div>
    ${n.note?`<h3>Why it matters</h3><p class="read">${esc(n.note)}</p>`:""}
    ${p?`<h3>Material conditions · ${esc(p.name)}</h3><p>${esc(p.mode)}. ${esc(p.note)}</p>`:""}
    ${mat.length?`<h3>Arises from (${mat.length})</h3>${matRows}`:""}
    ${n.translation?`<h3>Best edition</h3><p>${esc(n.translation)}</p>`:""}
    ${n.source?`<h3>Where to read</h3><p>${esc(n.source)}</p>`:""}
    ${n.parent?`<h3>Part of</h3><p>${esc(n.parent)}</p>`:""}
    ${n.threads&&n.threads.length?`<h3>Threads</h3><p>${esc(n.threads.join(", "))}</p>`:""}
    ${ins.length?`<h3>Draws on (${ins.length})</h3>${rowsFor(ins,"in")}`:""}
    ${outs.length?`<h3>Feeds into (${outs.length})</h3>${rowsFor(outs,"out")}`:""}
    ${!ins.length&&!outs.length&&!mat.length?`<h3>Connections</h3><p>None recorded yet.</p>`:""}`;
  a.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    sel=b.dataset.go; draw(); renderPanel();
    document.getElementById("scroll").scrollTo({left:POS[sel].x*Z-CTR(),behavior:"smooth"});
  });
  a.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>
    showEvent(D.events.find(x=>x.id===b.dataset.ev)));
}
function showEvent(ev){
  const a=document.getElementById("panel"); a.classList.remove("hidden"); sel=null; draw();
  const gives=(ev.works||[]).map(w=>{
    const t=typeof w==="string"?w:w.title, why=typeof w==="string"?"":w.because;
    const o=D.nodes.find(n=>n.name===t); if(!o)return "";
    return `<button class="lnk" data-go2="${o.id}" style="border-left-color:${pal[o.domain]}">
      ${esc(o.name)}<span class="rel"> · ${esc(o.person||"")}${why?" · "+esc(why):""}</span></button>`;
  }).join("");
  PB().innerHTML=`<h2>${esc(ev.name)}</h2><div class="by">${ev.year<0?Math.abs(ev.year)+" BCE":ev.year} · ${esc(ev.kind)}</div>
    <h3>The material fact</h3><p class="read">${esc(ev.note)}</p>
    ${gives?`<h3>Gives rise to</h3>${gives}`:""}`;
  a.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>{ select(b.dataset.go2);
    document.getElementById("scroll").scrollTo({left:POS[b.dataset.go2].x*Z-CTR(),behavior:"smooth"}); });
}

/* ---------- tooltip ---------- */
const tipEl=document.getElementById("tip");
function tip(e,a,b,c){
  tipEl.innerHTML=`<b>${esc(a)}</b><i>${esc(b||"")}</i>${c?"<div style='margin-top:4px'>"+esc(c)+"</div>":""}`;
  tipEl.style.opacity=1;
  const r=12; let x=e.clientX+r,y=e.clientY+r;
  if(x+300>innerWidth)x=e.clientX-300; if(y+120>innerHeight)y=e.clientY-120;
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px";
}
function hideTip(){tipEl.style.opacity=0;}

/* ---------- chrome ---------- */
const chips=document.getElementById("chips");
D.domainOrder.forEach(d=>{
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="sw" style="background:${pal[d]}"></span>${D.domainLabel[d]}`;
  b.onclick=()=>{ active.has(d)?active.delete(d):active.add(d);
    b.setAttribute("aria-pressed",active.has(d)); draw(); };
  chips.appendChild(b);
});
function refreshChips(){ [...chips.children].forEach((b,i)=>{
  b.querySelector(".sw").style.background=pal[D.domainOrder[i]]; }); }
document.getElementById("q").oninput=e=>{query=e.target.value.trim();draw();};
document.getElementById("linesBtn").onclick=e=>{showAll=!showAll;e.target.setAttribute("aria-pressed",showAll);draw();};
document.getElementById("unreadBtn").onclick=e=>{unreadOnly=!unreadOnly;e.target.setAttribute("aria-pressed",unreadOnly);draw();};
document.getElementById("themeBtn").onclick=e=>{
  theme=theme==="light"?"dark":"light";
  document.documentElement.dataset.theme=theme; pal=theme==="light"?D.light:D.dark;
  e.target.textContent=theme==="light"?"Dark":"Light"; refreshChips(); draw(); renderPanel(); legend();
};
document.getElementById("tableBtn").onclick=e=>{
  const t=document.getElementById("tableview"), s=document.getElementById("scroll");
  const on=t.style.display!=="block";
  t.style.display=on?"block":"none"; s.style.display=on?"none":"block";
  e.target.setAttribute("aria-pressed",on); if(on)renderTable();
};
let sortKey="year",sortDir=1;
function renderTable(){
  const rows=[...D.nodes].filter(n=>active.has(n.domain)&&(!unreadOnly||!isRead(n))&&(!query||match(n)))
    .sort((a,b)=>((a[sortKey]??"")>(b[sortKey]??"")?1:-1)*sortDir);
  document.getElementById("tableview").innerHTML=
   `<table><thead><tr>${[["name","Work"],["person","Author"],["year","Year"],["domain","Domain"],
     ["era","Period"],["status","Status"],["weight","Weight"],["source","Where to read"]]
     .map(([k,l])=>`<th data-k="${k}">${l}</th>`).join("")}</tr></thead><tbody>${
     rows.map(n=>`<tr><td>${esc(n.name)}</td><td>${esc(n.person)}</td>
      <td class="n">${esc(n.year_disp||n.year)}</td>
      <td><span class="tag dom" style="background:${pal[n.domain]}">${D.domainLabel[n.domain]}</span></td>
      <td>${esc((D.periods.find(p=>p.id===n.era)||{}).name)}</td>
      <td>${esc(n.status)}</td><td class="n">${n.weight}</td><td>${esc(n.source)}</td></tr>`).join("")}
     </tbody></table>`;
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    if(sortKey===th.dataset.k)sortDir*=-1; else{sortKey=th.dataset.k;sortDir=1;} renderTable();});
}
function legend(){
  const line=(dash,col)=>`<svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4"
     stroke="${col||"var(--ink2)"}" stroke-width="1.6"${dash?` stroke-dasharray="${dash}"`:""}/></svg>`;
  const keys=D.linkOrder.map(t=>`<span class="k">${line(D.linkStyle[t],
     t==="arises from"?"var(--ink)":"var(--ink2)")} ${t}</span>`).join("");
  const dot=(f,sw)=>`<svg width="14" height="10"><circle cx="6" cy="5" r="4"
     fill="${f}" stroke="var(--ink2)" stroke-width="${sw}"/></svg>`;
  document.getElementById("ln").innerHTML = keys +
    `<br><span class="k">${dot("var(--ink2)",1)} read</span>` +
    `<span class="k">${dot("none",2.2)} on deck</span>` +
    `<span class="k">${dot("none",1.3)} unread</span>` +
    `<span class="k">Diamonds along the bottom are the material events.</span>` +
    `<span class="k">Click anything. The dates are dates; the readings are an argument.</span>`;
}
document.getElementById("sub").textContent=
  `${D.nodes.length} works · ${D.edges.length} connections · built ${D.built}`;

/* ---------- phone: zoom, period jump, collapsible chrome ---------- */
function applyZoom(){
  svg.setAttribute("width",Math.round(W*Z));
  svg.setAttribute("height",Math.round(H*Z));
  syncGutter();
}
function zoomTo(nz,cx,cy){
  const s=document.getElementById("scroll");
  nz=Math.max(.22,Math.min(2.5,nz));
  const ux=(s.scrollLeft+cx)/Z, uy=(s.scrollTop+cy)/Z;
  Z=nz; applyZoom();
  s.scrollLeft=ux*Z-cx; s.scrollTop=uy*Z-cy;
}
function zoomStep(f){
  const s=document.getElementById("scroll");
  zoomTo(Z*f, s.clientWidth/2, s.clientHeight/2);
}
document.getElementById("zIn").onclick=()=>zoomStep(1.3);
document.getElementById("zOut").onclick=()=>zoomStep(1/1.3);

(function(){
  const s=document.getElementById("scroll");
  let d0=0, z0=1, cx=0, cy=0;
  const dist=tt=>Math.hypot(tt[0].clientX-tt[1].clientX,tt[0].clientY-tt[1].clientY);
  s.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
      d0=dist(e.touches); z0=Z;
      const r=s.getBoundingClientRect();
      cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
      cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    }
  },{passive:true});
  s.addEventListener("touchmove",e=>{
    if(e.touches.length===2&&d0){ e.preventDefault(); zoomTo(z0*dist(e.touches)/d0,cx,cy); }
  },{passive:false});
  s.addEventListener("touchend",()=>{d0=0;},{passive:true});
})();

const jumpSel=document.getElementById("jump");
D.periods.forEach(p=>{
  const o=document.createElement("option"); o.value=p.id; o.textContent=p.name;
  jumpSel.appendChild(o);
});
jumpSel.onchange=()=>{
  const p=D.periods.find(x=>x.id===jumpSel.value); if(!p)return;
  document.getElementById("scroll").scrollTo({left:Math.max(0,xOf(p.start)*Z-26),behavior:"smooth"});
};
document.getElementById("moreBtn").onclick=e=>{
  const h=document.querySelector("header"), on=!h.classList.contains("open");
  h.classList.toggle("open",on); e.target.setAttribute("aria-pressed",on);
};
document.getElementById("keyBtn").onclick=e=>{
  const l=document.getElementById("ln"), on=!l.classList.contains("open");
  l.classList.toggle("open",on); e.target.setAttribute("aria-pressed",on);
};
document.getElementById("closePanel").onclick=()=>{ sel=null; draw(); renderPanel(); };
document.getElementById("namesBtn").onclick=e=>{
  allNames=!allNames; MAXROW=allNames?200:40;
  e.target.setAttribute("aria-pressed",allNames);
  const s=document.getElementById("scroll"), keepX=s.scrollLeft;
  pack(); draw(); renderPanel(); s.scrollLeft=keepX;
};
if(matchMedia("(max-width:760px)").matches){
  Z=.85;
  requestAnimationFrame(()=>{
    const xs=Object.values(POS).map(q=>q.x);
    if(xs.length) document.getElementById("scroll").scrollLeft=Math.max(0,Math.min(...xs)*Z-PAD*Z-10);
  });
}

legend();
draw();
</script>
</body>
</html>
