 "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-spirit-of-the-laws", "name": "The Spirit of the Laws", "person": "Montesquieu", "domain": "politics", "category": "Political theory", "year": 1748, "year_disp": "1748", "weight": 3, "note": "Laws explained by climate, commerce, population and terrain rather than by the will of legislators, which is a materialism of a kind and the reason Montesquieu matters more than his separation of powers reputation suggests. He is also a president of a provincial parlement defending intermediate bodies against the crown.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "discourse-on-the-origin-of-inequality", "name": "Discourse on the Origin of Inequality", "person": "Jean-Jacques Rousseau", "domain": "politics", "category": "Political theory", "year": 1755, "year_disp": "1755", "weight": 4, "note": "The first man to fence a plot and say this is mine founds civil society, which is as close to a theory of primitive accumulation as the century gets. Rousseau has no account of how to get back out of it, and that absence is the distance between him and 1848.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "thoughts-and-sentiments-on-the-evil-of-slavery", "name": "Thoughts and Sentiments on the Evil of Slavery", "person": "Quobna Ottobah Cugoano", "domain": "politics", "category": "Political theory", "year": 1787, "year_disp": "1787", "weight": 3, "note": "A formerly enslaved man argues for immediate abolition and for compensation paid to the enslaved rather than the owners, going considerably further than the white abolitionists then organising, and he grounds it in the same natural rights the slaveholders were citing.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "constitution-of-saint-domingue", "name": "Constitution of Saint-Domingue", "person": "Toussaint Louverture", "domain": "politics", "category": "Political theory", "year": 1801, "year_disp": "1801", "weight": 4, "note": "The richest slave colony in the world writes itself a constitution abolishing slavery permanently while keeping plantation labour under compulsion, which is the real difficulty of a revolution that must go on exporting sugar in order to buy guns. Toussaint's problem is the one every later colonial revolution inherits.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-fable-of-the-bees", "name": "The Fable of the Bees", "person": "Bernard Mandeville", "domain": "economics", "category": "Economics", "year": 1714, "year_disp": "1714", "weight": 2, "note": "Private vices, public benefits, stated cynically enough to scandalise a century that then quietly adopted it. Mandeville grasps that a commercial economy needs consumption and therefore needs precisely the desires moralists condemn.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "tableau-economique", "name": "Tableau economique", "person": "Francois Quesnay", "domain": "economics", "category": "Economics", "year": 1758, "year_disp": "1758", "weight": 3, "note": "The first attempt to model an economy as a circuit of flows between classes, drawn by a court physician who thought of it as circulation of the blood. Its founding error, that only agriculture is productive, is a French landowning error, and Marx still rated it the most brilliant idea political economy had yet produced (Theories of Surplus-Value, part I).", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "an-inquiry-into-the-nature-and-causes-of-the-wealth-of-nations", "name": "An Inquiry into the Nature and Causes of the Wealth of Nations", "person": "Adam Smith", "domain": "economics", "category": "Economics", "year": 1776, "year_disp": "1776", "weight": 4, "note": "The division of labour is introduced through a pin factory, so the book opens on the manufacturing workshop that gives this whole period its name. Smith describes an economy on the edge of mechanisation but theorises it as though exchange rather than production were the driver, and that gap is where Marx does his work.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "a-dictionary-of-the-english-language", "name": "A Dictionary of the English Language", "person": "Samuel Johnson", "domain": "science", "category": "Reference", "year": 1755, "year_disp": "1755", "weight": 3, "note": "Compiled for a syndicate of booksellers rather than a royal academy, which is why the English standard was set by the London trade and not by the state. Johnson's illustrative quotations turned a commercial product into a canon.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "encyclopedie-ou-dictionnaire-raisonne-des-sciences-des-arts-et-des-metie", "name": "Encyclopedie, ou dictionnaire raisonne des sciences, des arts et des metiers", "person": "Denis Diderot and Jean le Rond d'Alembert", "domain": "science", "category": "Reference", "year": 1751, "year_disp": "1751-72", "weight": 5, "note": "Sold by subscription to a paying public, suppressed twice and finished anyway, it is the century's clearest proof that print had become an industry the state could no longer fully control. Its treatment of the mechanical arts, with plates of forges, looms and stocking frames given the dignity usually reserved for metaphysics, is the central intellectual claim of the era: that productive labour is knowledge and that the people doing it know things the schools do not.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "tartuffe", "name": "Tartuffe", "person": "Moliere", "domain": "literature", "category": "Poetry & Drama", "year": 1664, "year_disp": "1664", "weight": 2, "note": "Banned for five years because the devout party at court understood perfectly what was being said about them, and licensed the moment the king wanted them weakened. Court theatre is a weapon the crown lends out and takes back.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-rover", "name": "The Rover", "person": "Aphra Behn", "domain": "literature", "category": "Poetry & Drama", "year": 1677, "year_disp": "1677", "weight": 3, "note": "Behn wrote for money and said so, the first Englishwoman to make a living at it, and the marriage market in the play is examined by someone obliged to survive in another market. Restoration comedy's cynicism about sex is inseparable from its cynicism about property settlements.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "oroonoko", "name": "Oroonoko", "person": "Aphra Behn", "domain": "literature", "category": "Fiction", "year": 1688, "year_disp": "1688", "weight": 3, "note": "A royal slave in Surinam is pitied largely for having been a king, which is an aristocratic objection to slavery rather than an abolitionist one, and that is what makes the text historically precise. Sympathy enters English literature attached to rank long before it attaches to labour.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "robinson-crusoe", "name": "Robinson Crusoe", "person": "Daniel Defoe", "domain": "literature", "category": "Fiction", "year": 1719, "year_disp": "1719", "weight": 4, "note": "The isolated individual producing his subsistence by rational accounting became the founding image of political economy, and Marx used him to show why the image is a fiction, since Crusoe carries an entire society's tools and habits ashore with him. Friday's arrival converts the story from production to colonial command.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "gulliver-s-travels", "name": "Gulliver's Travels", "person": "Jonathan Swift", "domain": "literature", "category": "Fiction", "year": 1726, "year_disp": "1726", "weight": 4, "note": "Swift satirises the projecting spirit of a financial revolution he had watched detonate in the South Sea year, and the Houyhnhnms function as a trap for readers who want an ideal. The plain description of colonial conquest in the final chapter is the book's hardest passage and the one most often treated as an appendix.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "a-modest-proposal", "name": "A Modest Proposal", "person": "Jonathan Swift", "domain": "literature", "category": "Literature", "year": 1729, "year_disp": "1729", "weight": 2, "note": "The joke is that treating Irish children as a commodity merely extends a political economy that already treats Irish land, rent and grain that way. It remains the sharpest thing written in the century about a colonial famine economy.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "poems-on-various-subjects-religious-and-moral", "name": "Poems on Various Subjects, Religious and Moral", "person": "Phillis Wheatley", "domain": "literature", "category": "Poetry & Drama", "year": 1773, "year_disp": "1773", "weight": 4, "note": "Published in London because Boston would not, and prefaced by the attestation of eighteen white men that an enslaved woman had in fact written it, which tells you what the book had to overcome to exist at all. Wheatley works in the polished couplets of the master culture because that was the only proof of humanity the culture would accept.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-interesting-narrative-of-the-life-of-olaudah-equiano", "name": "The Interesting Narrative of the Life of Olaudah Equiano", "person": "Olaudah Equiano", "domain": "politics", "category": "Memoir", "year": 1789, "year_disp": "1789", "weight": 4, "note": "Equiano bought his own freedom by trading on the side and then sold the book by subscription, so the narrative is at once an abolitionist argument and a demonstration that its author could operate as a commercial man. The campaign it fed was the first mass extra-parliamentary movement in Britain, with petitions, a consumer boycott and a logo.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "fragments", "name": "Fragments", "person": "Sappho", "domain": "literature", "category": "Poetry & Drama", "year": -600, "year_disp": "c. 600 BCE", "weight": 2, "note": "The first European poetry with a private interior, appearing on Lesbos as coinage and long distance trade were producing households whose wealth was detachable from the clan. Lyric individuality is a symptom of that detachment rather than a discovery about the soul.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "archaic", "kind": "work"}, {"id": "on-floating-bodies", "name": "On Floating Bodies", "person": "Archimedes", "domain": "science", "category": "Science", "year": -250, "year_disp": "c. 250 BCE", "weight": 3, "note": "Mechanics pursued to a level not matched for eighteen centuries and then not developed, because a slave economy gave nobody an interest in saving labour. The gap between what Hellenistic science could do and what it was asked to do is the clearest ancient case of relations of production blocking productive forces.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "on-the-nature-of-things", "name": "On the Nature of Things", "person": "Lucretius", "domain": "literature", "category": "Poetry & Drama", "year": -55, "year_disp": "c. 55 BCE", "weight": 4, "note": "Atomism as a weapon against religion, in verse, while the Roman republic was tearing itself apart over land. Marx went to Epicurus for the swerve because it makes matter self moving without a legislator, which is the minimum condition for a materialism that is not fatalism.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "on-architecture", "name": "On Architecture", "person": "Vitruvius", "domain": "art", "category": "Architecture", "year": -25, "year_disp": "c. 25 BCE", "weight": 4, "note": "The only surviving classical treatise on building, and as much about materials, machines and the organisation of labour as about beauty. Its fifteenth century recovery gave Italian merchant republics a Roman vocabulary for their own construction boom, which is why it matters more after 1450 than it did when written.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "doryphoros", "name": "Doryphoros", "person": "Polykleitos", "domain": "art", "category": "Art", "year": -440, "year_disp": "c. 440 BCE", "weight": 3, "note": "The canon of proportion is a specification, not an inspiration: a rule that lets a workshop of slaves and hired craftsmen reproduce the same body in bronze and marble. Classical idealisation is standardisation before there is a market to standardise for.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "archaic", "kind": "work"}, {"id": "parthenon", "name": "Parthenon", "person": "Iktinos and Kallikrates", "domain": "art", "category": "Architecture", "year": -447, "year_disp": "447-432 BCE", "weight": 4, "note": "Built from Delian League tribute after the treasury was moved to Athens, so its famous refinements are imperial surplus made visible to the allies who paid for them. Reading it purely as the birth of Western form is to accept the building's own case for itself.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "archaic", "kind": "work"}, {"id": "terracotta-army", "name": "Terracotta Army", "person": "Unknown", "domain": "art", "category": "Art", "year": -210, "year_disp": "c. 210 BCE", "weight": 2, "note": "Mass production by mould and assembly under a state that had just standardised weights, axle widths and script, so the figures are less an army than a proof of administrative capacity. The earliest object on the map that is interesting chiefly as evidence of a labour process.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "pantheon", "name": "Pantheon", "person": "Apollodorus of Damascus (attributed)", "domain": "art", "category": "Architecture", "year": 126, "year_disp": "c. 126", "weight": 5, "note": "An unreinforced concrete dome spanning 43 metres, possible only because Rome had pozzolana, engineered formwork and coerced labour cheap enough to make the shuttering affordable. It fixed the dome as the form of imperial and then ecclesiastical authority for fifteen centuries.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "pont-du-gard", "name": "Pont du Gard", "person": "Unknown", "domain": "art", "category": "Architecture", "year": 50, "year_disp": "c. 50", "weight": 3, "note": "Infrastructure as the material basis of the tributary city: water carried fifty kilometres so a provincial colony could have the baths and fountains that made Roman citizenship look like a good bargain. Engineering here is a technique of rule.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "almagest", "name": "Almagest", "person": "Ptolemy", "domain": "science", "category": "Science", "year": 150, "year_disp": "c. 150", "weight": 4, "note": "A predictive model that works while being physically wrong, sustained for fourteen centuries because agriculture, navigation and the religious calendar needed the predictions and nothing needed the physics. The standing example of a science whose accuracy is set by what its users require of it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "city-of-god", "name": "City of God", "person": "Augustine", "domain": "philosophy", "category": "Philosophy", "year": 426, "year_disp": "426", "weight": 3, "note": "Written as the western empire's tax base collapsed, and its achievement is to detach the fate of the church from the fate of the state, which is what an institution needs if it is to outlive the state. The theology is also an inheritance strategy.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "hellenistic", "kind": "work"}, {"id": "hagia-sophia", "name": "Hagia Sophia", "person": "Anthemius of Tralles and Isidore of Miletus", "domain": "art", "category": "Architecture", "year": 537, "year_disp": "537", "weight": 4, "note": "The dome on pendentives solved a structural problem and a political one together: Justinian needed a space in which emperor and liturgy occupied one continuous volume. Byzantine centralisation is legible in the plan before it is legible in the law code.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "transition-feudal", "kind": "work"}, {"id": "mosaics-of-san-vitale", "name": "Mosaics of San Vitale", "person": "Unknown", "domain": "art", "category": "Art", "year": 547, "year_disp": "c. 547", "weight": 3, "note": "Justinian and Theodora face the viewer holding their offerings, frontal and weightless, because the image is not a record of persons but a statement about where authority sits. Naturalism is dropped when a ruling class needs icons rather than portraits.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "transition-feudal", "kind": "work"}, {"id": "dome-of-the-rock", "name": "Dome of the Rock", "person": "Unknown", "domain": "art", "category": "Architecture", "year": 691, "year_disp": "691", "weight": 3, "note": "The first monumental statement of a new tributary empire, built on the site the older religions claimed and by the craftsmen they had trained. Its inscriptions argue with Christianity in the architectural language of the state it had just displaced.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "transition-feudal", "kind": "work"}, {"id": "micrologus", "name": "Micrologus", "person": "Guido of Arezzo", "domain": "art", "category": "Music", "year": 1026, "year_disp": "c. 1026", "weight": 3, "note": "Staff notation made music transmissible without a teacher, which is a change in the productive forces of an art and not a change in taste. Everything later called Western composition rests on this storage technology.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "travellers-among-mountains-and-streams", "name": "Travellers among Mountains and Streams", "person": "Fan Kuan", "domain": "art", "category": "Art", "year": 1000, "year_disp": "c. 1000", "weight": 4, "note": "Monumental landscape for a scholar official class whose position rested on examinations and land rather than arms, with the human figures deliberately minute. Chinese painting reaches atmospheric depth without linear perspective because it is not solving a merchant's problem about measurable space.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "early-spring", "name": "Early Spring", "person": "Guo Xi", "domain": "art", "category": "Art", "year": 1072, "year_disp": "1072", "weight": 3, "note": "Painted for the Song court in the decade of Wang Anshi's reforms, and its shifting viewpoints belong to a bureaucracy that understood the empire as something surveyed from many stations rather than owned from one. Set beside Alberti, the difference between the two pictures is a difference between two states.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "summa-theologiae", "name": "Summa Theologiae", "person": "Thomas Aquinas", "domain": "philosophy", "category": "Philosophy", "year": 1265, "year_disp": "1265-1274", "weight": 4, "note": "Aristotle assimilated at the point where towns, universities and the money economy had grown enough that the church needed a doctrine of just price and usury rather than a simple prohibition. Scholasticism is feudal ideology working out how to live with commerce.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "chartres-cathedral", "name": "Chartres Cathedral", "person": "Unknown", "domain": "art", "category": "Architecture", "year": 1194, "year_disp": "1194-1220", "weight": 4, "note": "Rib vault and flying buttress let stone carry more window and less wall, and the windows were paid for by the trade guilds whose signs appear at their bases. A cathedral is surplus extraction visible from twenty miles away, financed by the same towns that were dissolving the manor.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "on-the-abbey-church-of-st-denis", "name": "On the Abbey Church of St-Denis", "person": "Abbot Suger", "domain": "art", "category": "Architecture", "year": 1145, "year_disp": "c. 1145", "weight": 3, "note": "A patron writing down his own justification for spending enormous sums on light and gold, which makes it the earliest European text in which aesthetic theory and building accounts sit together. Read it as a budget with a metaphysics attached.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "high-feudal", "kind": "work"}, {"id": "messe-de-nostre-dame", "name": "Messe de Nostre Dame", "person": "Guillaume de Machaut", "domain": "art", "category": "Music", "year": 1365, "year_disp": "c. 1365", "weight": 3, "note": "The first mass ordinary composed as a single work by one named person, marking the emergence of the composer as owner of a piece rather than servant of a rite. Authorship in music begins as a property relation before it becomes an artistic claim.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-decameron", "name": "The Decameron", "person": "Giovanni Boccaccio", "domain": "literature", "category": "Fiction", "year": 1353, "year_disp": "c. 1353", "weight": 3, "note": "A hundred stories told by people with money enough to leave a plague city, and the wit belongs to merchants and their wives rather than to knights. Post plague labour scarcity is in this book as social confidence before it shows up in the wage series.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "piers-plowman", "name": "Piers Plowman", "person": "William Langland", "domain": "literature", "category": "Poetry & Drama", "year": 1377, "year_disp": "c. 1377", "weight": 3, "note": "Written in the years of the Statute of Labourers and quoted by the rebels of 1381, its complaint about idle men and false pardons is a labour dispute in allegorical form. Ideology argues in the language of sin here because there is no other public language available.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-book-of-the-city-of-ladies", "name": "The Book of the City of Ladies", "person": "Christine de Pizan", "domain": "politics", "category": "Political theory", "year": 1405, "year_disp": "1405", "weight": 3, "note": "The first sustained European argument against the misogynist canon, written by a widow who supported herself by copying and selling her own books. Her professional independence and her argument are the same fact seen twice.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "dome-of-florence-cathedral", "name": "Dome of Florence Cathedral", "person": "Filippo Brunelleschi", "domain": "art", "category": "Architecture", "year": 1420, "year_disp": "1420-1436", "weight": 4, "note": "Built without centring by a goldsmith who treated it as an engineering and contracting problem, financed by the wool guild. The Renaissance in architecture begins as an innovation in machinery and labour management on a public works contract.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-holy-trinity", "name": "The Holy Trinity", "person": "Masaccio", "domain": "art", "category": "Art", "year": 1427, "year_disp": "c. 1427", "weight": 3, "note": "The first painting to place a measured architectural space behind the figures, with the donors kneeling inside it at their own scale. Perspective arrives as a way of showing that the patron occupies the same world as the sacred, which is a claim about the standing of merchant money.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "on-painting", "name": "On Painting", "person": "Leon Battista Alberti", "domain": "art", "category": "Art", "year": 1435, "year_disp": "1435", "weight": 5, "note": "Perspective codified as a procedure any workshop can follow, by a man who also wrote a treatise on running a household's accounts, and the two projects share the assumption that space and wealth are quantities. This is the technique by which European art becomes the visual grammar of a society that measures.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "ghent-altarpiece", "name": "Ghent Altarpiece", "person": "Hubert and Jan van Eyck", "domain": "art", "category": "Art", "year": 1432, "year_disp": "1432", "weight": 4, "note": "Oil glazes make cloth, metal and skin describable to the touch, and the commission came from a Ghent patrician rather than a prince. Northern realism is the visual culture of a textile economy that knew exactly what a fabric was worth.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "arnolfini-portrait", "name": "Arnolfini Portrait", "person": "Jan van Eyck", "domain": "art", "category": "Art", "year": 1434, "year_disp": "1434", "weight": 3, "note": "A merchant, a woman, oranges, a brass chandelier and a mirror, all given equal attention, which is the point: an inventory that has learned to look like a marriage. Portable movable wealth becomes a subject for painting in the city where it accumulates.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "david-donatello", "name": "David (Donatello)", "person": "Donatello", "domain": "art", "category": "Art", "year": 1440, "year_disp": "c. 1440", "weight": 3, "note": "The first free standing nude bronze since antiquity, made for a Medici courtyard, so the revival of the classical body happens indoors for a banking family before it happens in public. Patronage decides which antiquity gets revived.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "gutenberg-bible", "name": "Gutenberg Bible", "person": "Johannes Gutenberg", "domain": "science", "category": "Reference", "year": 1455, "year_disp": "1455", "weight": 4, "note": "The object matters less than the shop: movable type, oil based ink and a press adapted from wine production, assembled as a capitalised venture that promptly bankrupted its inventor. Europe's first mass produced commodity was a book, and it failed in the ordinary way.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "sistine-chapel-ceiling", "name": "Sistine Chapel ceiling", "person": "Michelangelo", "domain": "art", "category": "Art", "year": 1508, "year_disp": "1508-1512", "weight": 4, "note": "The papacy at the height of its fiscal reach, spending on a scale that helped provoke the indulgence controversy five years later. The ceiling and the Reformation are funded out of the same revenue problem.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "david-michelangelo", "name": "David (Michelangelo)", "person": "Michelangelo", "domain": "art", "category": "Art", "year": 1504, "year_disp": "1504", "weight": 3, "note": "Commissioned by the wool guild, sited by the republic outside the seat of government and facing Rome, and understood at the time as a statement by a city that had expelled the Medici. Civic republicanism given a body.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "melencolia-i", "name": "Melencolia I", "person": "Albrecht Durer", "domain": "art", "category": "Art", "year": 1514, "year_disp": "1514", "weight": 3, "note": "An engraving, therefore multipliable and saleable without a patron, showing tools, a polyhedron and a magic square around a figure who cannot act. Durer was the first major European artist to live off print runs, and his print is about the impasse of knowing rather than its glory.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-garden-of-earthly-delights", "name": "The Garden of Earthly Delights", "person": "Hieronymus Bosch", "domain": "art", "category": "Art", "year": 1500, "year_disp": "c. 1500", "weight": 3, "note": "Painted for a Netherlandish noble household in a region where wool and money were already moving to the towns, and its punishments are crowded with the instruments and commodities of that world. Apocalyptic imagination runs on the anxieties of a commercialising society.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "utopia", "name": "Utopia", "person": "Thomas More", "domain": "politics", "category": "Political theory", "year": 1516, "year_disp": "1516", "weight": 4, "note": "Book One describes enclosure and the hanging of vagrants; Book Two describes a society without private property. The order matters, because the fantasy is generated by the analysis, and Marx cites the same enclosure evidence three centuries later.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "ninety-five-theses", "name": "Ninety-five Theses", "person": "Martin Luther", "domain": "politics", "category": "Political theory", "year": 1517, "year_disp": "1517", "weight": 4, "note": "An academic objection to one financial instrument, the indulgence sold to fund building at Rome, which became a revolt because German princes wanted the church's land and revenues. Doctrine travelled on the print trade and won where it served a territorial treasury.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "sermon-to-the-princes", "name": "Sermon to the Princes", "person": "Thomas Muntzer", "domain": "politics", "category": "Political theory", "year": 1524, "year_disp": "1524", "weight": 3, "note": "The plebeian wing of the Reformation demanding that the princes act, and then arming against them, which is why Engels made Muntzer the hinge of The Peasant War in Germany. Theology is the only available idiom for a class demand that has no other.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "institutes-of-the-christian-religion", "name": "Institutes of the Christian Religion", "person": "John Calvin", "domain": "politics", "category": "Political theory", "year": 1536, "year_disp": "1536", "weight": 3, "note": "A doctrine that made worldly calling and disciplined accumulation into signs of election, and it took hold in exactly the commercial cities that needed a theology permitting profit. Whether the causation runs Weber's way or the reverse is an argument this map should host rather than settle.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "on-the-revolutions-of-the-heavenly-spheres", "name": "On the Revolutions of the Heavenly Spheres", "person": "Nicolaus Copernicus", "domain": "science", "category": "Science", "year": 1543, "year_disp": "1543", "weight": 4, "note": "A canon lawyer and estate administrator rearranged the heavens to save the calendar and the circles, and the physics that would make his system true did not yet exist. The revolution was not in the observations, which were old, but in who was now willing to publish.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "on-the-fabric-of-the-human-body", "name": "On the Fabric of the Human Body", "person": "Andreas Vesalius", "domain": "science", "category": "Science", "year": 1543, "year_disp": "1543", "weight": 4, "note": "Anatomy taken back from the barber surgeon's hands into the professor's, illustrated by a Venetian print workshop and dependent on a supply of executed bodies. The book is a joint product of dissection, the criminal law and the press.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "de-re-metallica", "name": "De re metallica", "person": "Georgius Agricola", "domain": "science", "category": "Science", "year": 1556, "year_disp": "1556", "weight": 3, "note": "Mining, smelting and drainage described in detail with woodcuts of the machines, written for the silver districts of Saxony and Bohemia whose output was then reshaping European prices. The clearest sixteenth century case of science written directly to the requirements of an extractive industry.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "a-short-account-of-the-destruction-of-the-indies", "name": "A Short Account of the Destruction of the Indies", "person": "Bartolome de las Casas", "domain": "politics", "category": "History", "year": 1552, "year_disp": "1552", "weight": 4, "note": "Testimony to the mass killing that accompanied primitive accumulation in the Americas, by a man who had held an encomienda himself and who for years proposed African slaves as the alternative. The document and its limits both belong to the history.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "florentine-codex", "name": "Florentine Codex", "person": "Bernardino de Sahagun and Nahua collaborators", "domain": "politics", "category": "History", "year": 1577, "year_disp": "c. 1577", "weight": 3, "note": "An ethnography compiled with Nahua scholars in Nahuatl in order to make conquest and conversion more efficient, and now the main surviving record of what it helped destroy. Colonial knowledge is not incidental to colonial extraction, it is one of its instruments.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "lives-of-the-artists", "name": "Lives of the Artists", "person": "Giorgio Vasari", "domain": "art", "category": "Art", "year": 1550, "year_disp": "1550", "weight": 3, "note": "The book that invented the artist's biography, progress in art and the idea of a Renaissance, written by a courtier of the restored Medici duchy. Art history begins as a Florentine dynastic claim about who is best.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "missa-pange-lingua", "name": "Missa Pange Lingua", "person": "Josquin des Prez", "domain": "art", "category": "Music", "year": 1515, "year_disp": "c. 1515", "weight": 3, "note": "Pervasive imitation makes every voice carry the same material, and Josquin was the first composer whose name sold printed partbooks in Petrucci's Venice. Musical style and the music trade change together.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "missa-papae-marcelli", "name": "Missa Papae Marcelli", "person": "Giovanni Pierluigi da Palestrina", "domain": "art", "category": "Music", "year": 1567, "year_disp": "1567", "weight": 3, "note": "Held up afterwards as proof that polyphony could survive Trent's demand for intelligible words, which makes it the founding case of a church or state body regulating musical form. Counter Reformation style is a compliance document.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-peasant-wedding", "name": "The Peasant Wedding", "person": "Pieter Bruegel the Elder", "domain": "art", "category": "Art", "year": 1567, "year_disp": "1567", "weight": 3, "note": "Painted for wealthy Antwerp buyers in the year Alba arrived, and the peasants are neither idealised nor quite mocked. This is the first European picture market in which ordinary labour becomes a subject because a merchant class will pay for the sight of it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "four-books-of-architecture", "name": "Four Books of Architecture", "person": "Andrea Palladio", "domain": "art", "category": "Architecture", "year": 1570, "year_disp": "1570", "weight": 4, "note": "Villa designs for Venetian patricians shifting their capital from trade into reclaimed farmland, published with plans and measurements so they could be copied. It became the house style of English and American landowners for two centuries because it was a cheap system for building agrarian wealth's country seat.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "world-map-on-the-mercator-projection", "name": "World Map on the Mercator Projection", "person": "Gerardus Mercator", "domain": "science", "category": "Reference", "year": 1569, "year_disp": "1569", "weight": 3, "note": "A projection that ruins area in order to make a constant compass bearing a straight line, which is useless to a geographer and indispensable to a ship carrying cargo. The most familiar image of the world was shaped by the needs of trade navigation.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "essays", "name": "Essays", "person": "Michel de Montaigne", "domain": "literature", "category": "Literature", "year": 1580, "year_disp": "1580", "weight": 3, "note": "A minor nobleman in the middle of the wars of religion invents a prose in which a self examines itself without authority, and in Of Cannibals turns the standard of barbarism back on Europe at the height of the conquests. Scepticism is what is left when neither church can win.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "the-merchant-of-venice", "name": "The Merchant of Venice", "person": "William Shakespeare", "domain": "literature", "category": "Poetry & Drama", "year": 1598, "year_disp": "c. 1598", "weight": 3, "note": "The play cannot decide whether the villain is usury or the Christians who need it, which is accurate, because Venice's wealth requires the lending it despises. Written in the decade the London joint stock companies were being chartered.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "crisis-feudal", "kind": "work"}, {"id": "doctor-faustus", "name": "Doctor Faustus", "person": "Christopher Marlowe", "domain": "literature", "category": "Poetry & Drama", "year": 1592, "year_disp": "c. 1592", "weight": 3, "note": "Knowledge as a purchased commodity with a term and a price, staged in the first commercial theatres, which were themselves speculative ventures selling admission by the penny. The bargain form o ted it. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "sermon-to-the-princes", "dst": "ninety-five-theses", "type": "responds to", "note": "Muntzer takes Luther's break with Rome to the conclusion Luther refused, which is why Luther called for the peasants to be cut down. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "sermon-to-the-princes", "dst": "the-peasant-war-in-germany", "type": "influenced", "note": "Engels makes Muntzer the case study for a revolutionary movement whose class basis cannot yet support its programme, which is the argument the map most needs from this period. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "institutes-of-the-christian-religion", "dst": "the-protestant-ethic-and-the-spirit-of-capitalism", "type": "influenced", "note": "Weber's whole thesis rests on the doctrine of election and the calling, and the map should carry the link precisely so the causal direction stays arguable. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "sistine-chapel-ceiling", "dst": "ninety-five-theses", "type": "same debate", "note": "The building programme the indulgences funded and the objection to the indulgences are two effects of one fiscal problem, which is the cleanest demonstration in the era that art and doctrine share a budget. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "the-oresteia", "dst": "the-origin-of-the-family-private-property-and-the-state", "type": "influenced", "note": "Engels reads the trilogy through Bachofen as evidence of the overthrow of mother right, and the link should be kept even by those who think the anthropology is wrong, because the reading itself is historically consequential. [from Map links preindustrial 19.08.26.csv, 19.08.26]"}, {"src": "on-the-nature-of-things", "dst": "difference-between-the-democritean-and-epicurean-philosophy-of-nature", "type": "influenced", "note": "Marx's dissertation goes to the Epicurean swerve for a ma plite line, not the heroic duel, is the society the poem is sung to"}, {"src": "ev-coinage", "dst": "fragments", "type": "arises from", "note": "Lyric appears in the Ionian and Aegean cities where coined money and trade were separating household wealth from clan obligation, and with it a private person who can address a private feeling."}, {"src": "ev-coinage", "dst": "politics", "type": "arises from", "note": "Aristotle's analysis of money and of chrematistike is only possible after two centuries of coinage had made the difference between use and exchange a visible social fact rather than a philosopher's distinction."}, {"src": "ev-solon", "dst": "the-oresteia", "type": "arises from", "note": "the trilogy ends by founding a court, at the moment the Areopagus is being stripped of power"}, {"src": "ev-solon", "dst": "the-republic", "type": "arises from", "note": "Plato is writing in a city whose political settlement rested on Solon's cancellation of debt bondage, and his hostility to property among rulers is an attempt to solve permanently what Solon solved once by decree."}, {"src": "ev-peloponnesian", "dst": "the-republic", "type": "arises from", "note": "defeat and the collapse of the democracy is why the ideal city is ruled by experts"}, {"src": "ev-peloponnesian", "dst": "the-history-of-the-peloponnesian-war", "type": "arises from", "note": "The book is the defeated empire's account of itself, written by a general it exiled, and its explanatory method comes from having to explain a loss that piety could not."}, {"src": "ev-peloponnesian", "dst": "the-oresteia", "type": "arises from", "note": "Staged in the years of the Ephialtic reforms and the alliance system that led to the war, it dramatises the transfer of vengeance from families to the courts of a city that was arming."}, {"src": "ev-alexander", "dst": "letters-and-principal-doctrines", "type": "arises from", "note": "the polis is gone, so ethics retreats to the garden"}, {"src": "ev-alexander", "dst": "elements", "type": "arises from", "note": "Alexandria's library and museum were a Ptolemaic state institution created out of conquest, and the compilation of Greek geometry into a single deductive system was the kind of work only a funded institution does."}, {"src": "ev-alexander", "dst": "on-floating-bodies", "type": "arises from", "note": "Hellenistic Syracuse and Alexandria supported mechanics because kings wanted engines and harbours, which is why the science advanced and why it stopped when the patronage did."}, {"src": "ev-alexander", "dst": "almagest", "type": "arises from", "note": "Ptolemy worked from Babylonian observational records that reached Greek astronomy through the conquest, so the most durable model in Western science was assembled out of an imperial archive."}, {"src": "ev-rome-fall", "dst": "city-of-god", "type": "arises from", "note": "Written directly in answer to the sack of Rome and the charge that abandoning the old gods had caused it, and its separation of the two cities is what allowed the church to survive the state that had adopted it."}, {"src": "ev-rome-fall", "dst": "mosaics-of-san-vitale", "type": "arises from", "note": "With the western administration gone, Ravenna became the point where a surviving eastern empire advertised its claim to the west, and the mosaics are that claim in gold."}, {"src": "ev-bayt-hikma", "dst": "the-compendious-book-on-calculation-by-completion-and-balancing", "type": "arises from", "note": "Abbasid patronage of translation and calculation, tied to taxation and inheritance law"}, {"src": "ev-bayt-hikma", "dst": "the-book-of-optics", "type": "arises from", "note": "The Greek optical corpus was available in Arabic because of the translation movement, and Ibn al-Haytham could test it against experiment rather than merely transmit it."}, {"src": "ev-bayt-hikma", "dst": "the-canon-of-medicine", "type": "arises from", "note": "A synthesis on this scale presupposes a library of translated Greek, Persian and Indian medicine, which is exactly what the Abbasid translation programme produced."}, {"src": "ev-plough", "dst": "the-canterbury-tales", "type": "arises from", "note": "the pilgrimage assembles exactly the social layers the commercial revival produced"}, {"src": "ev-plough", "dst": "chartres-cathedral", "type": "arises from", "note": "The agricultural surplus that the heavy plough and three field rotation released is what paid for the twelfth century building boom, and the guild windows record which part of that surplus had moved into the towns."}, {"src": "ev-plough", "dst": "on-the-abbey-church-of-st-denis", "type": "arises from", "note": "Suger could contemplate spending on this scale because the abbey's estates were producing more than they had a century earlier, and his treatise is an argument for what to do with an agrarian surplus."}, {"src": "ev-plough", "dst": "micrologus", "type": "arises from", "note": "Notation was developed in monastic schools that the same rising rural surplus supported, and it solved a problem of scale created by a church with houses across Europe."}, {"src": "ev-plague", "dst": "the-canterbury-tales", "type": "arises from", "note": "labour scarcity after the plague is why the Ploughman's brother can talk back"}, {"src": "ev-plague", "dst": "the-prince", "type": "arises from", "note": "the crisis of feudal authority is the vacuum the new prince is supposed to fill"}, {"src": "ev-plague", "dst": "natural-and-political-observations-made-upon-the-bills-of-mortality", "type": "arises from", "note": "The weekly bills existed as an epidemic early warning system for a city that had learned to fear plague, and Graunt turned an administrative by-product into the first quantitative account of a population."}, {"src": "ev-plague", "dst": "the-decameron", "type": "arises from", "note": "The frame is the plague itself, and the confidence of the storytellers belongs to the survivors of a mortality that had just raised the price of labour and loosened seigneurial control."}, {"src": "ev-plague", "dst": "piers-plowman", "type": "arises from", "note": "Written under the labour legislation that followed the plague, and its quarrel with idleness and false pardons is the ideological form of a fight over wages that ended in the revolt of 1381."}, {"src": "ev-print", "dst": "de-revolutionibus-orbium-coelestium", "type": "arises from", "note": "the diagram can be reproduced identically, which is what makes it arguable"}, {"src": "ev-print", "dst": "first-folio", "type": "arises from", "note": "a play becomes a book and therefore a canon"}, {"src": "ev-print", "dst": "news-from-nowhere", "type": "arises from", "note": "Morris built a press to make books as an argument about how work should feel"}, {"src": "ev-print", "dst": "the-disasters-of-war", "type": "arises from", "note": "Goya chose etching because prints could circulate and be hidden, which is why the plates survived a censorship that would have destroyed paintings."}, {"src": "ev-print", "dst": "the-great-wave-off-kanagawa", "type": "arises from", "note": "A woodblock edition of thousands sold cheaply to Edo townspeople is a print economy operating inside a feudal one."}, {"src": "ev-print", "dst": "the-people-s-charter", "type": "arises from", "note": "Chartism was held together by the Northern Star and a network of cheap unstamped papers as much as by the six points."}, {"src": "ev-print", "dst": "encyclopedie-ou-dictionnaire-raisonne-des-sciences-des-arts-et-des-metie", "type": "arises from", "note": "Four thousand subscribers and a syndicate of printers could finance and finish a project the crown had twice suppressed, which demonstrates that book production had become an industry with interests of its own."}, {"src": "ev-print", "dst": "a-dictionary-of-the-english-language", "type": "arises from", "note": "A commercial trade rather than an academy standardised written English, because in England the booksellers had the capital and the state did not have the interest."}, {"src": "ev-print", "dst": "dialogue-concerning-the-two-chief-world-systems", "type": "arises from", "note": "The danger was not the heliocentrism but the vernacular octavo, which put a contested cosmology into the hands of readers the universities did not control."}, {"src": "ev-print", "dst": "micrographia", "type": "arises from", "note": "The book sold on its fold-out engravings, and the plate was the technology that let an instrument's results travel further than the instrument could."}, {"src": "ev-print", "dst": "gulliver-s-travels", "type": "arises from", "note": "Swift is writing inside a London print market saturated with projects, prospectuses and subscription schemes, and the satire only lands because his readers had recently lost money to some of them."}, {"src": "ev-print", "dst": "gutenberg-bible", "type": "arises from", "note": "The first product of the press, and the first European commodity produced by mechanical reproduction on a capitalised venture that failed and was seized by its creditor."}, {"src": "ev-print", "dst": "ninety-five-theses", "type": "arises from", "note": "A local academic objection became a European movement in weeks because printers found it sold, which makes the Reformation the first political event carried by a mass medium."}, {"src": "ev-print", "dst": "melencolia-i", "type": "arises from", "note": "Durer's living came from printed sheets sold at fairs rather than from a single patron, which is the first time in Europe that an artist's independence rests on a reproduction technology."}, {"src": "ev-print", "dst": "missa-pange-lingua", "type": "arises from", "note": "Petrucci's printed partbooks created a market in which a composer's name sold music beyond the chapel that employed him, and Josquin was the first to benefit from it."}, {"src": "ev-print", "dst": "four-books-of-architecture", "type": "arises from", "note": "The treatise is designed to be copied from, which only makes sense once plans and measurements can be reproduced exactly and sold to patrons the architect will never meet."}, {"src": "ev-print", "dst": "lives-of-the-artists", "type": "arises from", "note": "Vasari could assemble and circulate a canon because print made a shared list of names possible, and art history begins as a printed argument about rank."}, {"src": "ev-1492", "dst": "novum-organum", "type": "arises from", "note": "navigation, mining and gunnery set the problems the new method is built to solve"}, {"src": "ev-1492", "dst": "narrative-of-the-life-of-frederick-douglass-an-american-slave", "type": "arises from", "note": "The plantation Douglass describes is the mature form of the Atlantic system that began with the Caribbean sugar colonies."}, {"src": "ev-1492", "dst": "incidents-in-the-life-of-a-slave-girl", "type": "arises from", "note": "The reproduction of enslaved people as capital was the American answer to the closing of the Atlantic trade."}, {"src": "ev-1492", "dst": "uncle-tom-s-cabin", "type": "arises from", "note": "Written against the Fugitive Slave Act, which extended the plantation's legal reach into the free states."}, {"src": "ev-1492", "dst": "slave-songs-of-the-united-states", "type": "arises from", "note": "Collected in the Sea Islands, on plantations abandoned by their owners, at the moment the system that produced the music collapsed."}, {"src": "ev-1492", "dst": "on-the-origin-of-species", "type": "arises from", "note": "Darwin's evidence came from a naval survey whose purpose was charting the trade routes of an empire built on the Atlantic system."}, {"src": "ev-1492", "dst": "las-meninas", "type": "arises from", "note": "The court Velazquez paints was financed by American bullion whose purchasing power had already collapsed, so the picture's magnificence is being staged by a monarchy that had defaulted repeatedly within living memory."}, {"src": "ev-1492", "dst": "don-quixote", "type": "arises from", "note": "Silver made Spain rich without making it productive, ruining exactly the small gentry Cervantes came from, and the knight's obsolescence is a class experience before it is a joke."}, {"src": "ev-1492", "dst": "still-life-with-a-gilt-cup", "type": "arises from", "note": "Every object on the table is an import or a manufacture dependent on one, so the genre is a record of what the carrying trade had made ordinary in a Dutch merchant's dining room."}, {"src": "ev-1492", "dst": "flower-still-life", "type": "arises from", "note": "The species Ruysch paints together never bloomed in the same season or the same continent, which is precisely the point: the bouquet is a portfolio of what the trading companies could source."}, {"src": "ev-1492", "dst": "amsterdam-canal-ring", "type": "arises from", "note": "The city expanded threefold in one generation on the profits of long distance trade, and the ring is the physical form of a merchant class investing its returns in urban land."}, {"src": "ev-1492", "dst": "metamorphosis-insectorum-surinamensium", "type": "arises from", "note": "Merian could only do the work because Dutch Surinam existed and would receive her, and the plantation economy supplied both her transport and the enslaved and indigenous informants she depended on."}, {"src": "ev-1492", "dst": "systema-naturae", "type": "arises from", "note": "The problem Linnaeus solved was created by colonial collecting: specimens were arriving faster than European naturalists could name them, and a name is an administrative device before it is a scientific one."}, {"src": "ev-1492", "dst": "oroonoko", "type": "arises from", "note": "Behn had been in Surinam when it was English, and the novella is written out of a colony changing hands and a sugar economy that already ran on African labour."}, {"src": "ev-1492", "dst": "robinson-crusoe", "type": "arises from", "note": "Crusoe is shipwrecked on a slaving voyage, owns a Brazilian plantation, and returns to collect its profits, which makes the great fable of self-reliance a merchant's account of the Atlantic circuit."}, {"src": "ev-1492", "dst": "candide", "type": "arises from", "note": "The mutilated slave at the Surinam mill is the moment the book stops being funny, and Voltaire put him there because the sugar in a Paris coffee house had a traceable origin everyone preferred not to trace."}, {"src": "ev-1492", "dst": "thoughts-and-sentiments-on-the-evil-of-slavery", "type": "arises from", "note": "Cugoano was taken from the Gold Coast and sold in Grenada, and the pamphlet's demand for immediate abolition with compensation to the enslaved comes from that experience rather than from the reformist calculation of his allies."}, {"src": "ev-1492", "dst": "the-interesting-narrative-of-the-life-of-olaudah-equiano", "type": "arises from", "note": "The book exists because a man who had been a commodity in the Atlantic trade acquired enough capital within it to buy himself and then to publish, which is an argument the trade could not answer."}, {"src": "ev-1492", "dst": "poems-on-various-subjects-religious-and-moral", "type": "arises from", "note": "Wheatley was shipped from Senegambia to Boston as a child and named after the vessel that carried her, and the book was published in London because the colonial market that produced her would not print her."}, {"src": "ev-1492", "dst": "a-short-account-of-the-destruction-of-the-indies", "type": "arises from", "note": "A direct account of the first phase of colonial extraction, written to influence the Spanish crown's policy on the encomienda, by a participant turned prosecutor."}, {"src": "ev-1492", "dst": "florentine-codex", "type": "arises from", "note": "Compiled to make evangelisation among the Nahua more effective after the conquest, which is why the fullest record of Mexica society exists at all."}, {"src": "ev-1492", "dst": "world-map-on-the-mercator-projection", "type": "arises from", "note": "The projection exists because Atlantic shipping needed constant compass bearings drawn as straight lines, and it spread with the trade that funded it."}, {"src": "ev-1492", "dst": "essays", "type": "arises from", "note": "Of Cannibals is written out of the reports and the captives brought back from Brazil, and turns the encounter into a question about the barbarism of the society doing the conquering."}, {"src": "ev-reformation", "dst": "the-peasant-war-in-germany", "type": "arises from", "note": "the class content underneath the theological quarrel"}, {"src": "ev-reformation", "dst": "the-calling-of-saint-matthew", "type": "arises from", "note": "Trent explicitly instructed that images should move the unlettered, and Caravaggio was hired to do exactly that in a parish church for a public the church was competing to keep."}, {"src": "ev-reformation", "dst": "judith-slaying-holofernes-gentileschi", "type": "arises from", "note": "The market for violent Old Testament subjects was a counter-reformation market, and it gave a woman painter access to commissions that a purely decorative tradition would not have."}, {"src": "ev-reformation", "dst": "sant-ivo-alla-sapienza", "type": "arises from", "note": "Rome kept spending on churches at a rate its shrinking economy could not justify because architecture was one of the few arenas in which the papacy could still act like a great power."}, {"src": "ev-reformation", "dst": "st-matthew-passion", "type": "arises from", "note": "Lutheran towns made congregational music a civic institution with a salaried staff and an annual liturgical calendar, and Bach's job description is a direct product of that settlement."}, {"src": "ev-reformation", "dst": "ethics", "type": "arises from", "note": "The confessional wars produced, in the Dutch Republic, a state that tolerated heterodoxy because it was commercially inconvenient to suppress it, and that narrow opening is where Spinoza's argument became sayable."}, {"src": "ev-reformation", "dst": "sermon-to-the-princes", "type": "arises from", "note": "Muntzer takes the break with Rome as a licence for the plebeian and peasant demands that Luther refused, and preaches it to the princes he would shortly be fighting."}, {"src": "ev-reformation", "dst": "institutes-of-the-christian-religion", "type": "arises from", "note": "The systematic doctrine the movement needed once it had to govern cities rather than merely protest, and it was written in and for the commercial towns that adopted it."}, {"src": "ev-reformation", "dst": "missa-papae-marcelli", "type": "arises from", "note": "The Council of Trent's response to the Reformation included regulating church music for intelligibility, and Palestrina's mass became the demonstration that polyphony could comply."}, {"src": "ev-reformation", "dst": "sistine-chapel-ceiling", "type": "arises from", "note": "The Roman building programme the ceiling belongs to was funded by the indulgence sales that provoked the revolt, so the two are opposite ends of one fiscal operation."}, {"src": "ev-enclosure", "dst": "leviathan", "type": "arises from", "note": "a society of masterless men needs a theory of why anyone obeys"}, {"src": "ev-enclosure", "dst": "lyrical-ballads", "type": "arises from", "note": "The vagrants, discharged soldiers and abandoned women of the ballads are the human output of parliamentary enclosure."}, {"src": "ev-enclosure", "dst": "an-essay-on-the-principle-of-population", "type": "arises from", "note": "Malthus writes as enclosure and a bad harvest push poor rates up, and supplies the argument for cutting them."}, {"src": "ev-enclosure", "dst": "the-hay-wain", "type": "arises from", "note": "Constable paints a settled agrarian order in Suffolk in the decade when it was being dismantled around him."}, {"src": "ev-enclosure", "dst": "the-gleaners", "type": "arises from", "note": "Gleaning was a customary right being extinguished by French landowners exactly as Millet monumentalised it."}, {"src": "ev-enclosure", "dst": "london-labour-and-the-london-poor", "type": "arises from", "note": "Mayhew's street population is rural dispossession arriving in the metropolis with no factory to absorb it."}, {"src": "ev-enclosure", "dst": "the-true-levellers-standard-advanced", "type": "arises from", "note": "Digging on St George's Hill was a direct response to the fencing of commons and waste, and the pamphlet argues from the customary right that enclosure was extinguishing rather than from any doctrine of equality."}, {"src": "ev-enclosure", "dst": "mr-and-mrs-andrews", "type": "arises from", "note": "The consolidated fields, the new fencing and the gun are the picture's actual subject, and portraiture is being asked to make a recent legal transfer of common right look like an inherited landscape."}, {"src": "ev-enclosure", "dst": "an-inquiry-into-the-nature-and-causes-of-the-wealth-of-nations", "type": "arises from", "note": "The labour that Smith finds available for the division of labour had to be separated from the land first, and his account of that separation as natural progress is the book's largest silence."}, {"src": "ev-enclosure", "dst": "gin-lane", "type": "arises from", "note": "The London poor Hogarth draws were substantially a rural population pushed off the land within living memory, and the moral panic about spirits is a panic about a labour force nobody was yet organising in factories."}, {"src": "ev-enclosure", "dst": "theory-of-the-earth", "type": "arises from", "note": "Hutton reasoned from the soil of an improved lowland farm he was managing himself, and the cyclical repair of the earth is the improving landlord's idea of maintenance projected onto geology."}, {"src": "ev-enclosure", "dst": "discourse-on-the-origin-of-inequality", "type": "arises from", "note": "The image of the first man who fenced a plot is not a metaphor drawn from nowhere, it is the visible European transformation of the eighteenth century read backwards into prehistory."}, {"src": "ev-enclosure", "dst": "the-royal-crescent-bath", "type": "arises from", "note": "The class that took the leases lived on agricultural rents and colonial appointments, and the Crescent is what that income looks like when it stops going into country houses and starts buying a season in town."}, {"src": "ev-enclosure", "dst": "utopia", "type": "arises from", "note": "Book One is a description of enclosure, depopulation and the hanging of the dispossessed, and the communism of Book Two is the answer it generates."}, {"src": "ev-enclosure", "dst": "the-peasant-wedding", "type": "arises from", "note": "Painted for Antwerp buyers whose wealth came from a countryside being reorganised for the market, and the peasants in it are becoming a subject for painting at the point they are becoming a problem for landlords."}, {"src": "ev-english-rev", "dst": "leviathan", "type": "arises from", "note": "written in exile from the revolution it is trying to explain away"}, {"src": "ev-english-rev", "dst": "paradise-lost", "type": "arises from", "note": "the defeated republic's secretary writing about a failed rebellion"}, {"src": "ev-english-rev", "dst": "the-people-s-charter", "type": "arises from", "note": "The Charter's demands restate the Levellers' Agreement of the People, a lineage the Chartists claimed for themselves."}, {"src": "ev-english-rev", "dst": "on-liberty", "type": "arises from", "note": "Mill's defence of dissent draws on a tradition of toleration argument that the English Revolution and its aftermath created."}, {"src": "ev-english-rev", "dst": "an-agreement-of-the-people", "type": "arises from", "note": "An army that had beaten the king and had not been paid needed a written answer to the question of what it had fought for, and no existing constitutional vocabulary supplied one. The document exists because the New Model was a standing political body before it was disbanded."}, {"src": "ev-english-rev", "dst": "the-law-of-freedom-in-a-platform", "type": "arises from", "note": "The collapse of censorship between 1641 and 1660 briefly made it possible to print a plan for abolishing the sale of land and labour and address it to the head of state. Winstanley wrote a constitution rather than a prophecy because for a few years it looked as though someone might implement one."}, {"src": "ev-english-rev", "dst": "two-treatises-of-government", "type": "arises from", "note": "The settlement of 1688 needed a justification that was neither divine right nor popular sovereignty, and Locke supplied one anchored in property that had been safe under both Stuarts and Cromwell."}, {"src": "ev-english-rev", "dst": "the-sceptical-chymist", "type": "arises from", "note": "The Royal Society was chartered in 1662 by a restored monarchy that wanted natural philosophy visibly separated from the sectarian enthusiasm of the previous twenty years. Boyle's careful experimental protocol is partly a political manner."}, {"src": "ev-english-rev", "dst": "st-paul-s-cathedral", "type": "arises from", "note": "The Anglican establishment restored in 1660 needed a monument that was neither Roman nor Puritan, and the Fire gave it the site and the coal duty gave it the money."}, {"src": "ev-english-rev", "dst": "a-serious-proposal-to-the-ladies", "type": "arises from", "note": "Once resistance to arbitrary power had been publicly argued and won, the argument was available to anyone who could read it, including women it had never been meant to reach. Astell's Toryism makes that leakage more striking, not less."}, {"src": "ev-steam", "dst": "the-wealth-of-nations", "type": "arises from", "note": "the division of labour is observed in manufacture just as machinery begins to supersede it"}, {"src": "ev-steam", "dst": "the-condition-of-the-working-class-in-england", "type": "arises from", "note": "Manchester, where Engels was sent to run the family firm"}, {"src": "ev-steam", "dst": "capital-volume-1", "type": "arises from", "note": "the factory system and the Blue Books that documented it are the book's evidence base"}, {"src": "ev-steam", "dst": "reflections-on-the-motive-power-of-fire", "type": "arises from", "note": "Carnot set out to explain why British engines were more efficient than French ones and derived a limit on all of them."}, {"src": "ev-steam", "dst": "on-the-mechanical-equivalent-of-heat", "type": "arises from", "note": "Joule measured in a brewery, using the thermometry of a trade that already lived by converting fuel into work."}, {"src": "ev-steam", "dst": "hard-times", "type": "arises from", "note": "Coketown is a composite of the Lancashire mill towns Dickens visited during the Preston strike of 1853."}, {"src": "ev-steam", "dst": "mary-barton", "type": "arises from", "note": "The novel's crisis is a trade depression in a city whose entire employment structure depended on the power loom."}, {"src": "ev-steam", "dst": "frankenstein", "type": "arises from", "note": "The fear of an assembled being that turns on its maker belongs to the decade of machine-breaking and its judicial hangings."}, {"src": "ev-steam", "dst": "rain-steam-and-speed", "type": "arises from", "note": "Turner painted the Great Western at the height of the railway mania, when the network was being laid faster than it could be financed."}, {"src": "ev-steam", "dst": "the-crystal-palace", "type": "arises from", "note": "Only an economy with mass sheet glass, standardised iron and a national railway to deliver them could have built it in nine months."}, {"src": "ev-steam", "dst": "notes-on-the-analytical-engine", "type": "arises from", "note": "Babbage's engine and Lovelace's reading of it come out of the same mechanisation of skilled hand work that produced the Jacquard loom."}, {"src": "ev-steam", "dst": "the-stones-of-venice", "type": "arises from", "note": "Ruskin's defence of the workman's freedom is unintelligible except as a reaction to factory production of ornament."}, {"src": "ev-steam", "dst": "the-palace-of-westminster", "type": "arises from", "note": "The medieval detail was mass-produced by Minton and Hardman in industrial quantities, which is the contradiction the building is made of."}, {"src": "ev-steam", "dst": "capital-volume-i", "type": "arises from", "note": "The chapters on machinery and the working day are written from the factory inspectors' reports that steam-powered production made necessary."}, {"src": "ev-steam", "dst": "the-iron-bridge-coalbrookdale", "type": "arises from", "note": "Coke smelting made cast iron cheap enough to use structurally, and the Darbys built the bridge partly as a demonstration to potential customers of what the material could do."}, {"src": "ev-steam", "dst": "an-experiment-on-a-bird-in-the-air-pump", "type": "arises from", "note": "Wright's patrons were the men building engines and mills in the Midlands, and the painting flatters them by making the manipulation of air and vacuum look like the central drama of the age, which for them it was."}, {"src": "ev-french-rev", "dst": "phenomenology-of-spirit", "type": "arises from", "note": "the terror is the section on absolute freedom, written in Jena as Napoleon arrives"}, {"src": "ev-french-rev", "dst": "a-vindication-of-the-rights-of-woman", "type": "arises from", "note": "written into the argument the revolution opened about who the rights are for"}, {"src": "ev-french-rev", "dst": "reflections-on-the-revolution-in-france", "type": "arises from", "note": "Written in 1790 as an alarm call to the English landed interest, before the Terror it is usually credited with predicting."}, {"src": "ev-french-rev", "dst": "rights-of-man", "type": "arises from", "note": "Paine wrote it to defend the revolution in England and priced it for artisans, which is why the government prosecuted the price as much as the argument."}, {"src": "ev-french-rev", "dst": "theorie-des-quatre-mouvements", "type": "arises from", "note": "Fourier's scheme is a response to a revolution he judged to have changed the state and left the organisation of labour intact."}, {"src": "ev-french-rev", "dst": "nouveau-christianisme", "type": "arises from", "note": "Saint-Simon watched the revolution destroy the clergy and spent his life designing a replacement priesthood of engineers."}, {"src": "ev-french-rev", "dst": "symphony-no-3-eroica", "type": "arises from", "note": "The dedication to Bonaparte and its erasure record the exact moment the revolution turned into an empire."}, {"src": "ev-french-rev", "dst": "lectures-on-aesthetics", "type": "arises from", "note": "Hegel's whole periodisation of art assumes that a world-historical rupture has just occurred and that thought arrives after it."}, {"src": "ev-french-rev", "dst": "the-third-of-may-1808", "type": "arises from", "note": "The Napoleonic occupation of Spain is the revolution arriving as an army, and Goya paints what it did to the people it came to liberate."}, {"src": "ev-french-rev", "dst": "liberty-leading-the-people", "type": "arises from", "note": "The July revolution of 1830 is the bourgeoisie collecting on 1789 without conceding anything to the crowd that fought for it."}, {"src": "ev-french-rev", "dst": "constitution-of-saint-domingue", "type": "arises from", "note": "The rights of man were proclaimed in Paris by an assembly full of men with colonial investments, and the colony took them literally, which is the sense in which 1789 produced a document its authors would have refused to sign."}, {"src": "ev-haiti", "dst": "appeal-to-the-coloured-citizens-of-the-world", "type": "arises from", "note": "Walker writes for readers who knew that enslaved people had already defeated a European army, which is what makes the pamphlet a threat rather than a plea."}, {"src": "ev-haiti", "dst": "the-slave-ship", "type": "arises from", "note": "Turner exhibited it in the year of the world anti-slavery convention, when British abolitionism was busy forgetting that the decisive blow had been struck by the enslaved themselves."}, {"src": "ev-haiti", "dst": "constitution-of-saint-domingue", "type": "arises from", "note": "A general risen from slavery had to write down what the
