<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A materialist map of ideas</title>
<style>
:root{
  color-scheme:light;
  --surface:#f9f7f2; --panel:#fffefb; --plane:#f2efe8;
  --ink:#14130f; --ink2:#514f47; --muted:#8a877d;
  --grid:#e4e0d5; --axis:#c6c2b4; --ring:rgba(20,19,15,.10);
  --band:#efebe1; --band2:#e7e2d5;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --panel:#232320; --plane:#111110;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#8b8a81;
  --grid:#2c2c2a; --axis:#3d3d39; --ring:rgba(255,255,255,.12);
  --band:#232321; --band2:#2a2a27;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--plane);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--ring);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:none}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ring);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:4px 11px 4px 8px;font-size:12.5px;cursor:pointer;
  display:flex;align-items:center;gap:6px;user-select:none}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.chip[aria-pressed="false"]{opacity:.4}
.chip:hover{border-color:var(--axis)}
input[type=search],select{font:inherit;font-size:13px;padding:5px 9px;border-radius:7px;
  border:1px solid var(--ring);background:var(--surface);color:var(--ink);min-width:170px}
button.b{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--ring);background:var(--surface);color:var(--ink2)}
button.b[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{flex:1;display:flex;min-height:0}
#scroll{flex:1;overflow:auto;background:var(--surface);position:relative}
aside{width:378px;flex:none;background:var(--panel);border-left:1px solid var(--ring);
  overflow:auto;padding:16px 18px 40px}
aside.hidden{display:none}
aside h2{font-size:17px;margin:0 0 2px;line-height:1.25}
aside .by{color:var(--ink2);font-size:13.5px;margin-bottom:10px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--plane);
  border:1px solid var(--ring);color:var(--ink2)}
.tag.dom{color:#fff}
.tag.read{background:var(--ink);color:var(--surface);border-color:var(--ink)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:16px 0 6px;font-weight:600}
aside p{margin:0 0 10px;font-size:13.5px;color:var(--ink2)}
aside p.read{color:var(--ink)}
.lnk{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 8px;
  border-radius:6px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;
  border-left:3px solid transparent}
.lnk:hover{background:var(--plane)}
.lnk .rel{color:var(--muted);font-size:11.5px}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--ring);
  border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:290px;opacity:0;
  transition:opacity .1s;box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:9}
#tip b{display:block;font-size:13px}
#tip i{color:var(--muted);font-style:normal;font-size:11.5px}
#tableview{display:none;overflow:auto;flex:1;background:var(--surface);padding:14px 18px 60px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--grid);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);cursor:pointer;font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.legendnote{font-size:11.5px;color:var(--muted);padding:0 16px 8px;line-height:1.7}
.legendnote .k{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
.legendnote svg{vertical-align:middle}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.nlabel{font-size:11px;fill:var(--ink2);pointer-events:none}
.nlabel.big{font-size:12.5px;fill:var(--ink);font-weight:600}
.lanelabel{font-size:12px;font-weight:600;fill:var(--muted);letter-spacing:.02em}
.axtick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.pername{font-size:11.5px;fill:var(--ink2);font-weight:600}
.evname{font-size:10.5px;fill:var(--muted)}
circle.nd{cursor:pointer}
.dim{opacity:.13}

/* ---------- phone ---------- */
.m-only{display:none}
#mobbar{display:none}
#closePanel{display:none;position:absolute;right:13px;top:11px;z-index:3;
  border:1px solid var(--ring);background:var(--surface);color:var(--ink2);
  border-radius:999px;width:30px;height:30px;font-size:17px;line-height:1;
  cursor:pointer;padding:0}
@media (pointer:coarse){ #tip{display:none!important} }
@media (max-width:760px){
  header{padding:7px 11px;gap:8px;row-gap:7px}
  h1{font-size:14.5px;flex:1;min-width:0}
  h1 small{font-size:10.5px}
  .spacer{display:none}
  .m-only{display:inline-block}
  header .m-hide{display:none}
  header.open .chips{display:flex;width:100%}
  header.open #q{display:block;width:100%;min-width:0}
  header.open button.m-hide{display:inline-block}
  #mobbar{display:flex;gap:7px;align-items:center;flex:none;
    padding:6px 11px;background:var(--panel);border-bottom:1px solid var(--ring)}
  #mobbar select{flex:1;min-width:0}
  #mobbar button.b{flex:none;min-width:38px;font-size:14px;padding:5px 10px}
  .legendnote{display:none}
  .legendnote.open{display:block;flex:none}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:64vh;
    border-left:0;border-top:1px solid var(--ring);border-radius:15px 15px 0 0;
    padding:20px 16px calc(30px + env(safe-area-inset-bottom));z-index:12;
    box-shadow:0 -8px 30px rgba(0,0,0,.22);-webkit-overflow-scrolling:touch}
  aside h2{padding-right:38px}
  #closePanel{display:block}
  #tableview{padding:10px 11px 60px}
  table{font-size:12px}
  th,td{padding:5px 6px}
}
</style>
</head>
<body>
<header>
  <h1>A materialist map of ideas<small id="sub"></small></h1>
  <button class="b m-only" id="moreBtn" aria-pressed="false">Filters</button>
  <div class="chips m-hide" id="chips"></div>
  <input type="search" id="q" class="m-hide" placeholder="Search title or author" autocomplete="off">
  <div class="spacer"></div>
  <button class="b m-hide" id="linesBtn" aria-pressed="false">All connections</button>
  <button class="b m-hide" id="unreadBtn" aria-pressed="false">Unread only</button>
  <button class="b m-hide" id="namesBtn" aria-pressed="true">All names</button>
  <button class="b m-hide" id="tableBtn" aria-pressed="false">Table</button>
  <button class="b m-hide" id="themeBtn">Dark</button>
</header>
<div id="mobbar">
  <select id="jump" aria-label="Jump to period"><option value="">Jump to period</option></select>
  <button class="b" id="zOut" aria-label="Zoom out">&minus;</button>
  <button class="b" id="zIn" aria-label="Zoom in">+</button>
  <button class="b" id="keyBtn" aria-pressed="false">Key</button>
</div>
<div class="legendnote" id="ln"></div>
<main>
  <div id="scroll"><svg id="svg"></svg></div>
  <div id="tableview"></div>
  <aside id="panel" class="hidden"><button id="closePanel" aria-label="Close">&times;</button><div id="panelbody"></div></aside>
</main>
<div id="tip"></div>

ry": "Political theory", "year": 1906, "year_disp": "1906", "weight": 4, "note": "Permanent revolution stated in 1906 by a twenty-six-year-old: in a backward country the bourgeoisie cannot make its own revolution, so the working class takes power first and cannot then stop at bourgeois limits. Everything downstream in the colonial and development argument runs through this, including the parts that reject it.", "status": "Read", "source": "marxists.org", "difficulty": "Moderate", "translation": "", "own": false, "parent": "", "tradition": "Trotskyism", "threads": ["12"], "order": "", "era": "imperialism", "kind": "work"}, {"id": "selected-subaltern-studies", "name": "Selected Subaltern Studies", "person": "ed. Ranajit Guha and Gayatri Spivak", "domain": "politics", "category": "History", "year": 1988, "year_disp": "1988", "weight": 4, "note": "Indian historians turning Gramsci's subaltern into a method: reading peasant insurgency out of the colonial police records that were written to deny it. The bridge from Gramsci to postcolonial theory.", "status": "Periphery", "source": "Library / buy", "difficulty": "Demanding", "translation": "English original.", "own": false, "parent": "", "tradition": "Subaltern studies", "threads": ["9"], "order": 320, "era": "neoliberal", "kind": "work"}, {"id": "selections-from-the-prison-notebooks", "name": "Selections from the Prison Notebooks", "person": "Antonio Gramsci", "domain": "philosophy", "category": "Philosophy", "year": 1929, "year_disp": "1929-35", "weight": 4, "note": "Hegemony, civil society and the intellectuals.", "status": "Periphery", "source": "marxists.org", "difficulty": "Demanding", "translation": "Hoare and Nowell-Smith (Lawrence and Wishart) for the Selections. Joseph Buttigieg (Columbia, 3 vols) is the complete critical edition and is the one to use as far as it reaches.", "own": false, "parent": "", "tradition": "Western Marxism", "threads": [], "order": 265, "era": "wars-revolution", "kind": "work"}, {"id": " art with.", "own": false, "parent": "", "tradition": "Zen Buddhism", "threads": ["11"], "order": 36, "era": "high-feudal", "kind": "work"}, {"id": "silent-spring", "name": "Silent Spring", "person": "Rachel Carson", "domain": "science", "category": "Science", "year": 1962, "year_disp": "1962", "weight": 4, "note": "Launched modern environmentalism.", "status": "Periphery", "source": "Library / buy", "difficulty": "Accessible", "translation": "English original.", "own": false, "parent": "", "tradition": "Environmental science", "threads": [], "order": 63, "era": "postwar", "kind": "work"}, {"id": "social-reform-or-revolution", "name": "Social Reform or Revolution", "person": "Rosa Luxemburg", "domain": "politics", "category": "Political theory", "year": 1899, "year_disp": "1899", "weight": 4, "note": "Against reformism; capitalism cannot be reformed away.", "status": "Periphery", "source": "marxists.org", "difficulty": "Accessible", "translation": "The Complete Works of Rosa Luxemburg vol III (Verso), or the Rosa Luxemburg Reader (Monthly Review). The free Integer text is 1937 and abridged.", "own": false, "parent": "", "tradition": "Classical Marxism", "threads": [], "order": 149, "era": "imperialism", "kind": "work"}, {"id": "socialism-utopian-and-scientific", "name": "Socialism: Utopian and Scientific", "person": "Friedrich Engels", "domain": "politics", "category": "Political theory", "year": 1880, "year_disp": "1880", "weight": 4, "note": "The classic short introduction to Marxism.", "status": "Read", "source": "marxists.org", "difficulty": "Accessible", "translation": "", "own": false, "parent": "MECW vol 24", "tradition": "Classical Marxism", "threads": ["5"], "order": "", "era": "imperialism", "kind": "work"}, {"id": "structural-anthropology", "name": "Structural Anthropology", "person": "Claude Levi-Strauss", "domain": "politics", "category": "Political theory", "year": 1958, "year_disp": "1958", "weight": 4, "note": "Saussure applied to kinship and myth. Th c science looked like before there was one.", "status": "Periphery", "source": "Free online", "difficulty": "Demanding", "translation": "No good complete English exists. Book 1 in O. Cameron Gruner, 1930, reissued by Laleh Bakhtiar (Kazi). Treat as a reference text rather than a read.", "own": false, "parent": "", "tradition": "Islamic medicine", "threads": ["11"], "order": 53, "era": "high-feudal", "kind": "work"}, {"id": "the-canterbury-tales", "name": "The Canterbury Tales", "person": "Geoffrey Chaucer", "domain": "literature", "category": "Poetry & Drama", "year": 1400, "year_disp": "1400", "weight": 4, "note": "Founding masterpiece of English poetry.", "status": "Periphery", "source": "Free online", "difficulty": "Moderate", "translation": "Middle English, so not a translation question. Read the Riverside Chaucer glossed. Coghill (Penguin) only if the Middle English defeats you.", "own": false, "parent": "", "tradition": "Narrative poetry / Framing narrative", "threads": [], "order": 76, "era": "crisis-feudal", "kind": "work"}, {"id": "the-civil-war-in-france", "name": "The Civil War in France", "person": "Karl Marx", "domain": "politics", "category": "Political theory", "year": 1871, "year_disp": "1871", "weight": 4, "note": "Lessons of the Paris Commune.", "status": "Periphery", "source": "marxists.org", "difficulty": "Moderate", "translation": "Written in English.", "own": false, "parent": "MECW vol 22", "tradition": "Classical Marxism", "threads": ["5"], "order": 127, "era": "imperialism", "kind": "work"}, {"id": "the-class-struggle-in-the-ancient-greek-world", "name": "The Class Struggle in the Ancient Greek World", "person": "G.E.M. de Ste. Croix", "domain": "politics", "category": "History", "year": 1981, "year_disp": "1981", "weight": 4, "note": "The major Marxist account of antiquity. Answers the Greek philosophy question from a materialist side.", "status": "Next", "source": "Library", "difficulty": "Demanding", "translation": "English original.", "ow ds.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "jude-the-obscure", "name": "Jude the Obscure", "person": "Thomas Hardy", "domain": "literature", "category": "Fiction", "year": 1895, "year_disp": "1895", "weight": 3, "note": "Class closure in an England that claimed to be opening. The reception drove Hardy out of fiction.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "the-cherry-orchard", "name": "The Cherry Orchard", "person": "Anton Chekhov", "domain": "literature", "category": "Poetry & Drama", "year": 1904, "year_disp": "1904", "weight": 4, "note": "An estate sold to the grandson of its serfs. The transition managed as farce and elegy at once.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "mother", "name": "Mother", "person": "Maxim Gorky", "domain": "literature", "category": "Fiction", "year": 1906, "year_disp": "1906", "weight": 3, "note": "The novel Soviet criticism made the founding text of socialist realism, written before there was a doctrine to serve.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "swann-s-way", "name": "Swann's Way", "person": "Marcel Proust", "domain": "literature", "category": "Fiction", "year": 1913, "year_disp": "1913", "weight": 5, "note": "A rentier class with nothing left to do but perceive. Modernism's inward turn given its most complete form. Volume one, given its own row because the catalogue's unit is the work.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "In Search of Lost Time", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "a-portrait-of-the-artist-as-a-young-man", "name": "A Portrait of the Artist as a Young Man", "person": "James Joyce", "domain": "literature", "category": "Fiction", "year": 1916, "year_disp": "1916", "weight": 4, "note": "Colonial Dublin, the church and the making of an exile, written the year of the Easter Rising.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "songs-of-innocence-and-of-experience", "name": "Songs of Innocence and of Experience", "person": "William Blake", "domain": "literature", "category": "Poetry & Drama", "year": 1789, "year_disp": "1789-94", "weight": 4, "note": "Blake sets the chartered street and the chimney sweep against the pastoral lyric to show that the new order has captured the language of innocence itself. The poems are not a protest against mills so much as an argument that commercial society reorganises perception.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "lyrical-ballads", "name": "Lyrical Ballads", "person": "William Wordsworth and Samuel Taylor Coleridge", "domain": "literature", "category": "Poetry & Drama", "year": 1798, "year_disp": "1798", "weight": 4, "note": "The preface's demand for the real language of men is a class programme dressed as an aesthetic one, staking poetry on rural labourers at the moment enclosure was destroying them. Wordsworth mourns a peasantry that the cheap print market he wrote for depended on displacing.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-mask-of-anarchy", "name": "The Mask of Anarchy", "person": "Percy Bysshe Shelley", "domain": "literature", "category": "Poetry & Drama", "year": 1819, "year_disp": "1819 (pub. 1832)", "weight": 4, "note": "Written within weeks of Peterloo, it converts a massacre into a tactic, proposing mass unarmed defiance before any organisation existed to carry it out. Its suppression for thirteen years shows how closely the post-war British state policed the link between print and assembly.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "a-defence-of-poetry", "name": "A Defence of Poetry", "person": "Percy Bysshe Shelley", "domain": "philosophy", "category": "Literary theory", "year": 1821, "year_disp": "1821 (pub. 1840)", "weight": 3, "note": "The claim that poets are unacknowledged legislators is a bid to secure a social function for intellectual labour just as the literary market was proletarianising writers. Idealist in method, thoroughly material in motive.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-painter-of-modern-life", "name": "The Painter of Modern Life", "person": "Charles Baudelaire", "domain": "philosophy", "category": "Literary theory", "year": 1863, "year_disp": "1863", "weight": 3, "note": "Baudelaire derives an aesthetic of the constantly renewed from fashion cycles, which is to say from the turnover time of capital. He theorises transience half a century before anyone theorised obsolescence.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "le-pere-goriot", "name": "Le Pere Goriot", "person": "Honore de Balzac", "domain": "literature", "category": "Fiction", "year": 1835, "year_disp": "1835", "weight": 4, "note": "Balzac tracks money through Paris with an accuracy Marx admired precisely because Balzac was a legitimist who hated what he saw. The novel is evidence that reactionary politics can produce sharper realism than progressive sentiment.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "La Comedie humaine", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "le-rouge-et-le-noir", "name": "Le Rouge et le Noir", "person": "Stendhal", "domain": "literature", "category": "Fiction", "year": 1830, "year_disp": "1830", "weight": 3, "note": "Julien Sorel is ambition under a restored aristocracy with no posts left to give, and the seminary and the salon are read as competing labour markets. The novel dates the moment class mobility became a private stratagem rather than a collective programme.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "hard-times", "name": "Hard Times", "person": "Charles Dickens", "domain": "literature", "category": "Fiction", "year": 1854, "year_disp": "1854", "weight": 4, "note": "Dickens attacks utilitarian political economy through the schoolroom rather than the factory, which is both his sharpest move and his evasion. Coketown is diagnosed as a moral condition, so the remedy can be sentiment instead of combination.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "mary-barton", "name": "Mary Barton", "person": "Elizabeth Gaskell", "domain": "literature", "category": "Fiction", "year": 1848, "year_disp": "1848", "weight": 4, "note": "Gaskell writes the hungry forties from inside a Manchester congregation and gives Chartist grievance an unusually accurate hearing before dissolving it in reconciliation. The gap between the reportage and the ending is the author's class position, visible on the page.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "middlemarch", "name": "Middlemarch", "person": "George Eliot", "domain": "literature", "category": "Fiction", "year": 1871, "year_disp": "1871-72", "weight": 4, "note": "Eliot puts provincial reform, railway surveying and medical science in one field to argue that history moves through unhistoric acts rather than great men. It is the most sustained English attempt to write social determination without giving up individual moral agency.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "imperialism", "kind": "work"}, {"id": "uncle-tom-s-cabin", "name": "Uncle Tom's Cabin", "person": "Harriet Beecher Stowe", "domain": "literature", "category": "Fiction", "year": 1852, "year_disp": "1852", "weight": 3, "note": "Its sales made abolition a mass-market commodity and proved the steam press could manufacture a political constituency. The sentimental machinery that sold it also fixed racial types that long outlived slavery.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "narrative-of-the-life-of-frederick-douglass-an-american-slave", "name": "Narrative of the Life of Frederick Douglass, an American Slave", "person": "Frederick Douglass", "domain": "politics", "category": "Memoir", "year": 1845, "year_disp": "1845", "weight": 4, "note": "Douglass shows literacy withheld as a condition of production rather than as prejudice, which turns the slave narrative into an analysis of the plantation as a workplace. The authenticating white prefaces are themselves evidence of the market he had to pass through.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "incidents-in-the-life-of-a-slave-girl", "name": "Incidents in the Life of a Slave Girl", "person": "Harriet Jacobs", "domain": "politics", "category": "Memoir", "year": 1861, "year_disp": "1861", "weight": 3, "note": "Jacobs writes the sexual economy of slavery that Douglass could not, insisting that reproduction was part of the plantation's capital stock. Its long dismissal as a novel is a lesson in whose testimony counts as evidence.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "an-essay-on-the-principle-of-population", "name": "An Essay on the Principle of Population", "person": "Thomas Robert Malthus", "domain": "economics", "category": "Economics", "year": 1798, "year_disp": "1798", "weight": 4, "note": "Malthus supplies capital with a natural law explaining why wages cannot rise and why the poor laws should go. It founds the durable argument that scarcity is demographic rather than distributional.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "principles-of-political-economy", "name": "Principles of Political Economy", "person": "John Stuart Mill", "domain": "economics", "category": "Economics", "year": 1848, "year_disp": "1848", "weight": 3, "note": "Mill separates the laws of production from the distribution of the product, the concession that allowed reform without expropriation. This is the intellectual origin of the idea that capitalism's outcomes are a policy choice.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "capital-volume-i", "name": "Capital, Volume I", "person": "Karl Marx", "domain": "economics", "category": "Economics", "year": 1867, "year_disp": "1867", "weight": 5, "note": "Marx locates exploitation in production rather than exchange, so a system of free and equal contracts still yields systematic appropriation. Almost everything after 1867 on this map is an extension of that argument or an answer to it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "Capital", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "reflections-on-the-revolution-in-france", "name": "Reflections on the Revolution in France", "person": "Edmund Burke", "domain": "politics", "category": "Political theory", "year": 1790, "year_disp": "1790", "weight": 3, "note": "Burke defends inherited property as the condition of liberty and thereby invents the conservative case against abstract right. It is the clearest available statement of what the landed interest thought was at stake in 1789.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "rights-of-man", "name": "Rights of Man", "person": "Thomas Paine", "domain": "politics", "category": "Political theory", "year": 1791, "year_disp": "1791-92", "weight": 4, "note": "Paine answers Burke with progressive taxation and old-age provision, so the most widely read radical text of the period is also a welfare state blueprint. The cheap sixpenny editions were the real offence and were prosecuted as such.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "theorie-des-quatre-mouvements", "name": "Theorie des quatre mouvements", "person": "Charles Fourier", "domain": "politics", "category": "Political theory", "year": 1808, "year_disp": "1808", "weight": 3, "note": "The phalanstery is a serious attempt to organise labour around desire rather than discipline, and it is absurd in exactly the ways utopian planning is absurd. Marx and Engels kept the critique of the bourgeois family and threw away the arithmetic.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "a-new-view-of-society", "name": "A New View of Society", "person": "Robert Owen", "domain": "politics", "category": "Political theory", "year": 1813, "year_disp": "1813-16", "weight": 3, "note": "Owen demonstrates at New Lanark that shorter hours and schooling raise output, then generalises it into a claim that character is formed by circumstance. The paternalism is the substance: reform arrives as a gift from the mill owner, not a demand from the operatives.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "nouveau-christianisme", "name": "Nouveau christianisme", "person": "Henri de Saint-Simon", "domain": "politics", "category": "Political theory", "year": 1825, "year_disp": "1825", "weight": 3, "note": "Saint-Simon proposes rule by industrialists and scientists in the name of the poorest class, which is technocracy with a conscience rather than socialism. The line from here runs to planning bureaus, not to workers' councils.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "appeal-to-the-coloured-citizens-of-the-world", "name": "Appeal to the Coloured Citizens of the World", "person": "David Walker", "domain": "politics", "category": "Political theory", "year": 1829, "year_disp": "1829", "weight": 3, "note": "Walker addresses enslaved people directly and treats resistance as a right rather than a petition, which is why southern legislatures criminalised its circulation. Abolition had a Black revolutionary wing before it had a white liberal one.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "what-is-property", "name": "What Is Property?", "person": "Pierre-Joseph Proudhon", "domain": "politics", "category": "Political theory", "year": 1840, "year_disp": "1840", "weight": 4, "note": "The famous slogan covers a defence of small proprietorship, which is why Marx spent a book demolishing him. The unresolved confusion between possession and property still organises anarchist and socialist disagreement.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-people-s-charter", "name": "The People's Charter", "person": "William Lovett and the London Working Men's Association", "domain": "politics", "category": "Political theory", "year": 1838, "year_disp": "1838", "weight": 4, "note": "Six constitutional demands became the first independent mass political movement of the working class, and five were eventually granted once they no longer threatened property. Chartism's defeat is why British socialism arrived through unions rather than through the franchise.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "declaration-of-sentiments", "name": "Declaration of Sentiments", "person": "Elizabeth Cady Stanton and the Seneca Falls Convention", "domain": "politics", "category": "Political theory", "year": 1848, "year_disp": "1848", "weight": 3, "note": "Seneca Falls borrows the form of the Declaration of Independence to expose its restriction, a tactic that works because the original was already a property settlement. Its abolitionist roots and its later racial exclusions are both part of the record.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "on-liberty", "name": "On Liberty", "person": "John Stuart Mill", "domain": "politics", "category": "Political theory", "year": 1859, "year_disp": "1859", "weight": 4, "note": "Mill defends dissent as the condition of progress at the moment a literate industrial public was becoming politically dangerous. The harm principle is elastic enough to have served the labour movement and its opponents equally well.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-subjection-of-women", "name": "The Subjection of Women", "person": "John Stuart Mill", "domain": "politics", "category": "Political theory", "year": 1869, "year_disp": "1869", "weight": 3, "note": "Mill treats marriage as the last surviving legal form of chattel status and argues partly from the economic waste of excluding half the population. Harriet Taylor's contribution goes unacknowledged in the text, an irony the argument can absorb.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "instructions-pour-une-prise-d-armes", "name": "Instructions pour une prise d'armes", "person": "Louis Auguste Blanqui", "domain": "politics", "category": "Political theory", "year": 1868, "year_disp": "1868 (pub. 1972)", "weight": 2, "note": "Blanqui reduces revolution to a technical problem of barricades, timetables and disciplined minorities, the most practical and most politically hollow answer to 1848. Unpublished for a century, it made blanquism a label rather than a doctrine.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "london-labour-and-the-london-poor", "name": "London Labour and the London Poor", "person": "Henry Mayhew", "domain": "politics", "category": "History", "year": 1851, "year_disp": "1851", "weight": 3, "note": "Mayhew's interviews with street sellers and scavengers document a metropolitan surplus population that the factory model of the working class leaves out. The taxonomy is voyeuristic and the transcription is invaluable.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "lectures-on-aesthetics", "name": "Lectures on Aesthetics", "person": "G.W.F. Hegel", "domain": "philosophy", "category": "Philosophy", "year": 1835, "year_disp": "1835-38 (delivered 1818-29)", "weight": 4, "note": "Hegel argues that art has a history because spirit has a history, the move Marxist aesthetics inherits after inverting its idealist ground. The claim that art has ceased to be the highest expression of truth is a bourgeois self-portrait taken for a universal law.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "reflections-on-the-motive-power-of-fire", "name": "Reflections on the Motive Power of Fire", "person": "Sadi Carnot", "domain": "science", "category": "Science", "year": 1824, "year_disp": "1824", "weight": 4, "note": "Thermodynamics begins as an inquiry into why English steam engines outperformed French ones, so the second law arrives out of industrial competition. Few results in physics have a clearer material paternity.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "principles-of-geology", "name": "Principles of Geology", "person": "Charles Lyell", "domain": "science", "category": "Science", "year": 1830, "year_disp": "1830-33", "weight": 4, "note": "Lyell needs deep time for uniform processes to do their work, and deep time was made thinkable by canal cuttings, quarries and mining surveys. The book supplies the temporal frame without which Darwin has no argument.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "experimental-researches-in-electricity", "name": "Experimental Researches in Electricity", "person": "Michael Faraday", "domain": "science", "category": "Science", "year": 1839, "year_disp": "1839-55", "weight": 4, "note": "Faraday works without mathematics and produces the field concept, induction and the motor, which industry converted into generators within a generation. His refusal to patent is a real dissent from the property regime his discoveries enriched.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "notes-on-the-analytical-engine", "name": "Notes on the Analytical Engine", "person": "Ada Lovelace", "domain": "science", "category": "Science", "year": 1843, "year_disp": "1843", "weight": 3, "note": "Lovelace sees that a machine manipulating symbols is not a machine doing arithmetic, and she gets there via the Jacquard loom, which is to say via textile automation. The insight found no application because no capital existed to fund one.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "on-the-mechanical-equivalent-of-heat", "name": "On the Mechanical Equivalent of Heat", "person": "James Prescott Joule", "domain": "science", "category": "Science", "year": 1845, "year_disp": "1845 (pub. 1850)", "weight": 3, "note": "A brewer measures heat as work and helps establish energy conservation, which is the physics proper to a society organised around turning fuel into motion. His instruments came from the trade, not from a university.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "memoire-sur-la-fermentation-appelee-lactique", "name": "Memoire sur la fermentation appelee lactique", "person": "Louis Pasteur", "domain": "science", "category": "Science", "year": 1857, "year_disp": "1857", "weight": 3, "note": "Pasteur solves a problem set by the beet sugar and wine industries and ends up dismantling spontaneous generation. Germ theory enters the world as industrial quality control before it becomes medicine.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "a-dynamical-theory-of-the-electromagnetic-field", "name": "A Dynamical Theory of the Electromagnetic Field", "person": "James Clerk Maxwell", "domain": "science", "category": "Science", "year": 1865, "year_disp": "1865", "weight": 4, "note": "Maxwell unifies electricity, magnetism and light in equations the telegraph and later the power grid depended on. Field theory is the mathematics of an economy already laying cable across oceans.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "experiments-on-plant-hybridisation", "name": "Experiments on Plant Hybridisation", "person": "Gregor Mendel", "domain": "science", "category": "Science", "year": 1866, "year_disp": "1866", "weight": 3, "note": "Mendel's ratios came out of monastery garden plots and an agricultural improvement society, and were ignored for thirty-four years because no discipline existed to receive them. Rediscovery in 1900 tracks the rise of commercial plant breeding.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-third-of-may-1808", "name": "The Third of May 1808", "person": "Francisco Goya", "domain": "art", "category": "Art", "year": 1814, "year_disp": "1814", "weight": 4, "note": "Goya paints an execution without heroism, giving the anonymous victim all the light and the firing squad no faces. It is the first major European painting to treat imperial occupation from below.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-disasters-of-war", "name": "The Disasters of War", "person": "Francisco Goya", "domain": "art", "category": "Art", "year": 1810, "year_disp": "1810-20 (pub. 1863)", "weight": 4, "note": "Prints rather than paintings because the medium could circulate, though in the event they could not be published until thirty-five years after his death. The captions refuse the consolation that history painting was designed to supply.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-raft-of-the-medusa", "name": "The Raft of the Medusa", "person": "Theodore Gericault", "domain": "art", "category": "Art", "year": 1819, "year_disp": "1819", "weight": 4, "note": "Gericault paints a government scandal at the scale of history painting and puts shipwrecked colonists and a Black sailor where a monarch belongs. The Salon could not decide whether it was news or art, which was the point.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-hay-wain", "name": "The Hay Wain", "person": "John Constable", "domain": "art", "category": "Art", "year": 1821, "year_disp": "1821", "weight": 3, "note": "Constable's Suffolk is a working landscape painted with meteorological precision and emptied of the enclosure disputes and rick burnings of those same years. The truthfulness of the sky is what makes the omission persuasive.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "liberty-leading-the-people", "name": "Liberty Leading the People", "person": "Eugene Delacroix", "domain": "art", "category": "Art", "year": 1830, "year_disp": "1830", "weight": 4, "note": "Delacroix commemorates the July revolution with an allegory carrying a real musket, which is how the bourgeoisie preferred its insurrections remembered. The state bought it and then kept it out of public view for years.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-great-wave-off-kanagawa", "name": "The Great Wave off Kanagawa", "person": "Katsushika Hokusai", "domain": "art", "category": "Art", "year": 1831, "year_disp": "c. 1831", "weight": 3, "note": "A cheap colour woodblock made for a mass urban market inside a closed feudal economy, using Prussian blue imported through Dutch traders. Its later canonisation in Paris begins European modernism's dependence on Asian visual labour.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "Thirty-six Views of Mount Fuji", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-slave-ship", "name": "The Slave Ship", "person": "J.M.W. Turner", "domain": "art", "category": "Art", "year": 1840, "year_disp": "1840", "weight": 4, "note": "Turner exhibits the Zong massacre as sublime weather, which is either the most damning treatment of the trade in British painting or its aestheticisation. Ruskin owned it and eventually could not live with it, which is a fair response.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "rain-steam-and-speed", "name": "Rain, Steam and Speed", "person": "J.M.W. Turner", "domain": "art", "category": "Art", "year": 1844, "year_disp": "1844", "weight": 4, "note": "The locomotive is painted as a dissolution of the landscape it crosses, with a hare running ahead of it. Turner grasps that the railway alters not just transport but the perceptual conditions of painting.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "a-burial-at-ornans", "name": "A Burial at Ornans", "person": "Gustave Courbet", "domain": "art", "category": "Art", "year": 1850, "year_disp": "1850", "weight": 4, "note": "A provincial funeral twenty-two feet wide with no focal hierarchy, which critics correctly read as an assault on the genre system. Realism here is a claim about who is entitled to monumental representation.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-gleaners", "name": "The Gleaners", "person": "Jean-Francois Millet", "domain": "art", "category": "Art", "year": 1857, "year_disp": "1857", "weight": 4, "note": "Millet paints the customary right to glean at the moment landowners were extinguishing it, and bourgeois critics saw revolution in three bent backs. The picture is politically ambiguous and was received as unambiguous, which is the interesting fact about it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "symphony-no-3-eroica", "name": "Symphony No. 3 (Eroica)", "person": "Ludwig van Beethoven", "domain": "art", "category": "Music", "year": 1804, "year_disp": "1804", "weight": 4, "note": "The scratched-out dedication to Bonaparte is the whole bourgeois revolution on one manuscript page. Musically it is the moment the symphony becomes an argument to be followed rather than a diversion to be enjoyed.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "symphony-no-9", "name": "Symphony No. 9", "person": "Ludwig van Beethoven", "domain": "art", "category": "Music", "year": 1824, "year_disp": "1824", "weight": 4, "note": "Choral utopianism in a public hall for a paying audience is a new social form for music as much as the finale is a new content. The Ninth establishes that a symphony can carry a political programme, which every later composer had to negotiate.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "slave-songs-of-the-united-states", "name": "Slave Songs of the United States", "person": "William Francis Allen and Charles Pickard Ware and Lucy McKim Garrison", "domain": "art", "category": "Music", "year": 1867, "year_disp": "1867", "weight": 3, "note": "The first substantial transcription of Black American music was made by abolitionist teachers who admitted the notation could not hold what they had heard. It marks the entry of the spiritual into a print economy that would monetise everything derived from it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-stones-of-venice", "name": "The Stones of Venice", "person": "John Ruskin", "domain": "art", "category": "Architecture", "year": 1851, "year_disp": "1851-53", "weight": 4, "note": "The chapter on the nature of Gothic argues that a building records the freedom of the workmen who made it, turning architectural criticism into a critique of the division of labour. Morris later reprinted it as a socialist pamphlet, correctly.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-crystal-palace", "name": "The Crystal Palace", "person": "Joseph Paxton", "domain": "art", "category": "Architecture", "year": 1851, "year_disp": "1851", "weight": 4, "note": "Prefabricated iron and glass assembled in months to house a global exhibition of commodities, the first building whose method is its meaning. The Great Exhibition displayed colonial raw materials and British manufactures in the same hall without embarrassment.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "haussmann-s-renovation-of-paris", "name": "Haussmann's Renovation of Paris", "person": "Georges-Eugene Haussmann", "domain": "art", "category": "Architecture", "year": 1853, "year_disp": "1853-70", "weight": 4, "note": "Boulevards driven through insurrectionary quarters served circulation, ground rent and artillery at once, and the debt that paid for them invented modern municipal borrowing. The Commune fought hardest in the districts Haussmann had not yet reached.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-palace-of-westminster", "name": "The Palace of Westminster", "person": "Charles Barry and A.W.N. Pugin", "domain": "art", "category": "Architecture", "year": 1840, "year_disp": "1840-70", "weight": 3, "note": "An industrial state chose fourteenth-century Gothic for its parliament and built it with mass-produced ornament, ideology and technique disagreeing inside one building. Pugin supplied the medievalism and died of the workload.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "the-calling-of-saint-matthew", "name": "The Calling of Saint Matthew", "person": "Caravaggio", "domain": "art", "category": "Art", "year": 1600, "year_disp": "1600", "weight": 4, "note": "Rome after Trent needed an art that could reach an illiterate urban poor the Reformation had nearly taken, and Caravaggio supplies it by putting a tax collector's counting table and ordinary street lighting inside the sacred scene. The tenebrism usually read as psychology is better read as a delivery mechanism for a church fighting a propaganda war it could still lose.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "Contarelli Chapel cycle", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "judith-slaying-holofernes-gentileschi", "name": "Judith Slaying Holofernes (Gentileschi)", "person": "Artemisia Gentileschi", "domain": "art", "category": "Art", "year": 1620, "year_disp": "c. 1620", "weight": 4, "note": "Gentileschi worked inside the same clerical and aristocratic patronage as the men and had to market her authorship as spectacle, which is the material condition that biographical readings keep collapsing into trauma. The painting's real argument is that killing is manual labour requiring two pairs of hands and good bracing.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-anatomy-lesson-of-dr-nicolaes-tulp", "name": "The Anatomy Lesson of Dr Nicolaes Tulp", "person": "Rembrandt van Rijn", "domain": "art", "category": "Art", "year": 1632, "year_disp": "1632", "weight": 3, "note": "A guild commissions its own group portrait and gets a commodity advertising the surgeons' monopoly over a corpse supplied by the gallows. Dutch civic portraiture is the self-documentation of a bourgeoisie with no court to be painted at and no saints it is allowed to commission.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-night-watch", "name": "The Night Watch", "person": "Rembrandt van Rijn", "domain": "art", "category": "Art", "year": 1642, "year_disp": "1642", "weight": 4, "note": "The militia company subscribed by the head and Rembrandt spent the money on movement rather than on equal visibility for each payer, which is why it is simultaneously a masterpiece and poor client service. It marks the point where the artist's claim on the work starts to outrun the patron's.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-milkmaid", "name": "The Milkmaid", "person": "Johannes Vermeer", "domain": "art", "category": "Art", "year": 1658, "year_disp": "c. 1658", "weight": 4, "note": "Painted for an open market rather than a commission, so its subject is domestic labour made worth owning by a merchant class with wall space and no dynastic mythology to display. The celebrated stillness is a property of a product that had to survive being looked at every day in a private house.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "still-life-with-a-gilt-cup", "name": "Still Life with a Gilt Cup", "person": "Willem Claesz Heda", "domain": "art", "category": "Art", "year": 1635, "year_disp": "1635", "weight": 3, "note": "Dutch still life is the first sustained European painting of commodities as commodities: imported porcelain, Levantine pepper, Venetian glass and a half-peeled lemon arranged as the visible yield of a carrying trade. Read it as inventory rather than as vanitas moralising and the genre stops looking repetitive.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "flower-still-life", "name": "Flower Still Life", "person": "Rachel Ruysch", "domain": "art", "category": "Art", "year": 1700, "year_disp": "c. 1700", "weight": 3, "note": "Tulips and their rivals enter these pictures as speculative assets with a botanical afterlife, and the buyers knew the prices. Ruysch's long and well paid career also shows that the market, unlike the guild or the court, would buy from a woman provided the product sold.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "las-meninas", "name": "Las Meninas", "person": "Diego Velazquez", "domain": "art", "category": "Art", "year": 1656, "year_disp": "1656", "weight": 4, "note": "A court running on American silver that was already inflating away commissions a painting whose actual subject is the machinery of court representation. That the painter argues for his own nobility inside the picture is the symptom of a hidalgo order with titles left to give and very little else.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "gin-lane", "name": "Gin Lane", "person": "William Hogarth", "domain": "art", "category": "Art", "year": 1751, "year_disp": "1751", "weight": 4, "note": "Hogarth sold prints rather than canvases, and the print market let him address the same London labouring poor the image is about. The plate campaigns for the Gin Act on behalf of employers who wanted a workforce sober enough to be worked, which is a colder account of it than moral reform.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "Gin Lane and Beer Street", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "mr-and-mrs-andrews", "name": "Mr and Mrs Andrews", "person": "Thomas Gainsborough", "domain": "art", "category": "Art", "year": 1750, "year_disp": "c. 1750", "weight": 4, "note": "Half the canvas goes to sheaved corn and a well managed enclosed field because the sitters' claim is to land, not lineage. English portraiture is doing the ideological work of making recent agrarian capitalist accumulation look like inherited landscape.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "an-experiment-on-a-bird-in-the-air-pump", "name": "An Experiment on a Bird in the Air Pump", "person": "Joseph Wright of Derby", "domain": "art", "category": "Art", "year": 1768, "year_disp": "1768", "weight": 4, "note": "Wright painted for Midlands manufacturers and gave them their own cosmology, with the subscription demonstration lecture replacing the altarpiece as the scene of revelation. The candlelight is borrowed from Caravaggio and redirected from grace to pneumatics.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "oath-of-the-horatii", "name": "Oath of the Horatii", "person": "Jacques-Louis David", "domain": "art", "category": "Art", "year": 1784, "year_disp": "1784", "weight": 4, "note": "Commissioned by the crown and instantly readable against it, which is the position of most late ancien regime culture. The neoclassicism is not nostalgia but a search for a visual language of civic obligation that the rococo interior could not supply.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "amsterdam-canal-ring", "name": "Amsterdam Canal Ring", "person": "Amsterdam city council and Hendrick Jacobsz Staets", "domain": "art", "category": "Architecture", "year": 1613, "year_disp": "1613-1663", "weight": 4, "note": "A speculative land development laid out by a city government that was also the merchant class, with plot widths and frontage taxes designed for resale. The tall narrow house with its hoisting beam is warehouse and dwelling in one, which is what merchant capital looks like before the factory separates work from home.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "palace-of-versailles", "name": "Palace of Versailles", "person": "Louis Le Vau and Jules Hardouin-Mansart", "domain": "art", "category": "Architecture", "year": 1661, "year_disp": "1661-1710", "weight": 4, "note": "Absolutism could not defeat its nobility so it bankrupted them in ceremony, and Versailles is that policy in stone. The building is a fiscal instrument as much as a residence, and the tax base that paid for it is the peasantry that would be counted in the cahiers of 1789.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "st-paul-s-cathedral", "name": "St Paul's Cathedral", "person": "Christopher Wren", "domain": "art", "category": "Architecture", "year": 1710, "year_disp": "1710", "weight": 3, "note": "Rebuilt after the Fire on the proceeds of a tax on coal coming into London, which makes the great monument of the Anglican settlement a building financed by the trade that would power the next century. The dome compromises Roman prestige with Protestant plainness, much as 1688 compromised politically.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-royal-crescent-bath", "name": "The Royal Crescent, Bath", "person": "John Wood the Younger", "domain": "art", "category": "Architecture", "year": 1774, "year_disp": "1774", "weight": 2, "note": "Georgian terrace building was a leasehold speculation in which a single uniform facade sold identical rentable units to a class living on rents, dividends and colonial appointments. Palladian order here functions as a marketing standard rather than a philosophy of proportion.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-iron-bridge-coalbrookdale", "name": "The Iron Bridge, Coalbrookdale", "person": "Abraham Darby III and Thomas Farnolls Pritchard", "domain": "art", "category": "Architecture", "year": 1779, "year_disp": "1779", "weight": 4, "note": "The first large structural use of cast iron, detailed with carpentry joints because nobody yet knew how iron ought to be joined. It sits on the hinge of this era and works as an advertisement for the Darby works at least as much as a river crossing.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "sant-ivo-alla-sapienza", "name": "Sant'Ivo alla Sapienza", "person": "Francesco Borromini", "domain": "art", "category": "Architecture", "year": 1660, "year_disp": "1660", "weight": 2, "note": "Papal Rome went on building extravagantly while its economy slid to the edge of an Atlantic system it had helped open. Borromini's compressed geometry is the intensity of a culture whose material weight was falling.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "l-orfeo", "name": "L'Orfeo", "person": "Claudio Monteverdi", "domain": "art", "category": "Music", "year": 1607, "year_disp": "1607", "weight": 4, "note": "Opera begins as court entertainment for the Gonzaga and only later becomes a Venetian product sold by ticket, which is the single most consequential fact about the form. Monteverdi subordinates counterpoint to text because a princely audience expected to hear the words it had paid for.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "st-matthew-passion", "name": "St Matthew Passion", "person": "Johann Sebastian Bach", "domain": "art", "category": "Music", "year": 1727, "year_disp": "1727", "weight": 4, "note": "Bach was a municipal employee of a Lutheran town writing to a liturgical deadline with the forces the council would fund. Treating the Passion as free artistic self-expression rather than commissioned civic craft obscures the fact that its scale was a budget decision.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-well-tempered-clavier", "name": "The Well-Tempered Clavier", "person": "Johann Sebastian Bach", "domain": "art", "category": "Music", "year": 1722, "year_disp": "1722-1742", "weight": 3, "note": "A pedagogical response to instrument makers solving a tuning problem, so a work of art whose premise is a change in the means of production. It is also teaching material written by a man whose household income depended on pupils.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "messiah", "name": "Messiah", "person": "George Frideric Handel", "domain": "art", "category": "Music", "year": 1741, "year_disp": "1741", "weight": 3, "note": "Handel moved from aristocratic opera subscription to public oratorio when the former stopped paying, and English oratorio is largely that business decision in musical form. The charity performances that made its reputation bound sacred music to the philanthropic self-image of the merchant city.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-beggar-s-opera", "name": "The Beggar's Opera", "person": "John Gay", "domain": "art", "category": "Music", "year": 1728, "year_disp": "1728", "weight": 4, "note": "The hit of the London season made highwaymen and fences stand for Walpole's ministry on the argument that the only difference is scale. It also broke Italian opera commercially by using tunes the audience already knew, which is a class attack conducted through choice of repertoire.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "le-nozze-di-figaro", "name": "Le nozze di Figaro", "person": "Wolfgang Amadeus Mozart", "domain": "art", "category": "Music", "year": 1786, "year_disp": "1786", "weight": 4, "note": "Beaumarchais was banned, and Mozart and da Ponte got the play past the censor by cutting the speeches and keeping the plot, which still turns on a servant defeating a lord over access to a woman's body. Three years before the Bastille the Viennese court was applauding it.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "astronomia-nova", "name": "Astronomia Nova", "person": "Johannes Kepler", "domain": "science", "category": "Science", "year": 1609, "year_disp": "1609", "weight": 4, "note": "The ellipse is won by grinding through Tycho's Mars observations, and those observations exist because Danish and imperial revenues paid for celestial data with navigational and calendrical uses. Kepler's insistence on physical causes is astronomy shifting from geometry to mechanics.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "exercitatio-anatomica-de-motu-cordis-et-sanguinis-in-animalibus", "name": "Exercitatio Anatomica de Motu Cordis et Sanguinis in Animalibus", "person": "William Harvey", "domain": "science", "category": "Science", "year": 1628, "year_disp": "1628", "weight": 3, "note": "Circulation is proved by ligature and by arithmetic on the quantity of blood moved per hour, an argument only available to a mind at ease with pumps. Harvey was a royal physician and no radical, which is a useful check on any tidy alignment of scientific with political revolution.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "natural-and-political-observations-made-upon-the-bills-of-mortality", "name": "Natural and Political Observations Made upon the Bills of Mortality", "person": "John Graunt", "domain": "science", "category": "Science", "year": 1662, "year_disp": "1662", "weight": 2, "note": "Population becomes something countable and projectable, built out of parish death registers kept for plague administration. This is where the state's interest in bodies as a resource first takes statistical form.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-sceptical-chymist", "name": "The Sceptical Chymist", "person": "Robert Boyle", "domain": "science", "category": "Science", "year": 1661, "year_disp": "1661", "weight": 3, "note": "Boyle attacks the four elements experimentally while keeping a gentleman's protocol of credible witnessing, so the authority of the new science rests on the social standing of who was in the room. Air pump work was expensive, and expense selected the witnesses.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "micrographia", "name": "Micrographia", "person": "Robert Hooke", "domain": "science", "category": "Science", "year": 1665, "year_disp": "1665", "weight": 3, "note": "A Royal Society showpiece that sold on its engravings, demonstrating both that instruments open new worlds and that the Society deserved support. Hooke was a salaried curator of experiments, an early instance of scientific labour performed for wages.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "philosophiae-naturalis-principia-mathematica", "name": "Philosophiae Naturalis Principia Mathematica", "person": "Isaac Newton", "domain": "science", "category": "Science", "year": 1687, "year_disp": "1687", "weight": 5, "note": "One body of law covering falling apples and planetary orbits, published in the year before the Glorious Revolution and rapidly enlisted as proof that the natural and political orders were alike regular and settled. Its lasting leverage is that it made the physical world calculable by anyone with the mathematics, and navigation, ballistics, machine design and eventually the whole apparatus of engineering took up the offer.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "metamorphosis-insectorum-surinamensium", "name": "Metamorphosis Insectorum Surinamensium", "person": "Maria Sibylla Merian", "domain": "science", "category": "Science", "year": 1705, "year_disp": "1705", "weight": 4, "note": "Field research carried out in a Dutch slave colony, drawing on knowledge from enslaved and indigenous women whom Merian credits more openly than most contemporaries did. Natural history in this period travels on the same ships as the sugar.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "systema-naturae", "name": "Systema Naturae", "person": "Carl Linnaeus", "domain": "science", "category": "Science", "year": 1735, "year_disp": "1735", "weight": 4, "note": "Binomial nomenclature is an administrative technology for an empire receiving specimens faster than it can describe them. The same drive produced the racial varieties of humankind in later editions, which is not an incidental blemish but the method applied consistently to people.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "theory-of-the-earth", "name": "Theory of the Earth", "person": "James Hutton", "domain": "science", "category": "Science", "year": 1788, "year_disp": "1788", "weight": 3, "note": "Deep time comes from an improving Scottish landowner watching soil erode and thinking about the maintenance of a farm as a cycle. Geology matures alongside coal and canal surveying because those were the trades that cut into rock at scale.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "traite-elementaire-de-chimie", "name": "Traite elementaire de chimie", "person": "Antoine Lavoisier", "domain": "science", "category": "Science", "year": 1789, "year_disp": "1789", "weight": 4, "note": "Chemistry rebuilt around conserved mass and a new nomenclature by a man whose day job was tax farming and gunpowder administration, using the same balance for both. The Revolution executed the tax farmer rather than the chemist, and the distinction is worth holding onto.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "industrial", "kind": "work"}, {"id": "an-essay-concerning-human-understanding", "name": "An Essay Concerning Human Understanding", "person": "John Locke", "domain": "philosophy", "category": "Philosophy", "year": 1689, "year_disp": "1689", "weight": 3, "note": "Knowledge from experience rather than innate ideas removes the foundation under inherited authority of every kind. It is the epistemological half of what the Two Treatises do politically, and the two were published within months of each other for a reason.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "monadology", "name": "Monadology", "person": "Gottfried Wilhelm Leibniz", "domain": "philosophy", "category": "Philosophy", "year": 1714, "year_disp": "1714", "weight": 2, "note": "A metaphysics of pre-established harmony written by a courtier and diplomat whose working life went on reconciling confessions and dynasties. His calculating machine and his binary arithmetic belong to the same impulse to make thought mechanical.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "a-treatise-of-human-nature", "name": "A Treatise of Human Nature", "person": "David Hume", "domain": "philosophy", "category": "Philosophy", "year": 1739, "year_disp": "1739-40", "weight": 3, "note": "Causation dissolved into habit, the self into a bundle, morality into sentiment: scepticism pushed until only custom is left standing, and custom for Hume conveniently includes property and commerce. The century's most radical epistemology underwrites a settled conservative politics.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "an-agreement-of-the-people", "name": "An Agreement of the People", "person": "The Levellers", "domain": "politics", "category": "Political theory", "year": 1647, "year_disp": "1647", "weight": 3, "note": "The first attempt in English to write a constitution from below, produced by soldiers who had won a war and wanted to know what they had won. The Putney argument over the franchise, where servants and almstakers are excluded as dependent on others, shows property already doing the defining work.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-true-levellers-standard-advanced", "name": "The True Levellers Standard Advanced", "person": "Gerrard Winstanley", "domain": "politics", "category": "Political theory", "year": 1649, "year_disp": "1649", "weight": 3, "note": "Digging the commons at St George's Hill was an argument made with spades: the earth a common treasury, private title in land the surviving Norman Yoke. It collapsed within a year because the local propertied were perfectly able to hire men to beat the diggers off.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "the-law-of-freedom-in-a-platform", "name": "The Law of Freedom in a Platform", "person": "Gerrard Winstanley", "domain": "politics", "category": "Political theory", "year": 1652, "year_disp": "1652", "weight": 4, "note": "Winstanley's constitution abolishes the buying and selling of land and labour, which makes him this era's furthest point, and he addresses it to Cromwell, which makes him its clearest lesson about whose revolution it was.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "two-treatises-of-government", "name": "Two Treatises of Government", "person": "John Locke", "domain": "politics", "category": "Political theory", "year": 1689, "year_disp": "1689", "weight": 5, "note": "Property founded on mixing one's labour with the world, and government instituted to protect it, hands the propertied classes of 1688 a theory of legitimate resistance that stops precisely where their own interests end. Locke wrote the labour theory of appropriation while invested in the Royal African Company, and that is not private hypocrisy but the structure of Atlantic liberalism, which is why the same text is doing work in 1776, in 1789 and in every later argument about who owns what.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "", "threads": [], "order": "", "era": "manufacture", "kind": "work"}, {"id": "a-serious-proposal-to-the-ladies", "name": "A Serious Proposal to the Ladies", "person": "Mary Astell", "domain": "politics", "category": "Political theory", "year": 1694, "year_disp": "1694", "weight": 3, "note": "Astell asks why, if arbitrary power is intolerable in a state, it should be thought natural in a marriage, and she asks it as a Tory High Churchwoman rather than a radical. The contract argument leaked immediately into places its authors had not intended, which is the interesting part.", "status": "Periphery", "source": "", "difficulty": "", "translation": "", "own": false, "parent": "", "tradition": "",
